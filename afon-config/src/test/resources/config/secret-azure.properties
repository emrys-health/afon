# AZURE_CLIENT_ID from portal: Active Directory > App Registrations > AfonMultiTenantApp
# or : az ad app list --display-name AfonMultiTenantApp --query "[].appId" -o tsv
AZURE_CLIENT_ID=client_id
# TENANT_ID from portal: Active Directory > App Registrations > AfonMultiTenantApp
# or: az account tenant list --query "[].tenantId -o tsv"
AZURE_TENANT_ID=tenant_id
# AZURE_CLIENT_SECRET are generated in portal:  Active Directory > App Registrations > AfonMultiTenantApp > secrets (but only IDs are shown)
AZURE_CLIENT_SECRET=client_secret
AZURE_CONNECTION_STRING=connection_string
# DATABRICKS_TOKEN from: databricks tokens create --lifetime-seconds 31536000 --comment "My CLI Token"
DATABRICKS_TOKEN=token
# OAUTH2
AZURE_OAUTH2_CLIENT_ID=client_id
AZURE_OAUTH2_CLIENT_SECRET=client_secret
AZURE_OAUTH2_COOKIE_SECRET=cookie_secret
