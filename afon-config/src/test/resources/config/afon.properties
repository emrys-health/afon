# Kubernetes cluster
CLUSTER_NAME=cluster
# Polaris endpoint
POLARIS_ENDPOINT=localhost:8181

# OIDC
OIDC_ISSUER_URL=https://oauth.click/realms/polaris
OIDC_EMAIL_DOMAIN=*

# KEYCLOAK
KC_HOSTNAME=oauth.click
# Public scheme KeyCloak advertises in its issuer URLs. Defaults to https if omitted; behind the
# AWS load balancer (which terminates TLS) this must be https so oauth2-proxy accepts the issuer.
KC_PROTOCOL=https

# SNOWFLAKE
SNOWFLAKE_JDBC_URL=jdbc:snowflake://name.snowflakecomputing.com/
