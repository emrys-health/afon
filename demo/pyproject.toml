[project]
name = "synthetic-fhir-cancer"
version = "0.1.0"
description = "Synthetic FHIR R4 cancer EHR generator and multi-site causal inference demo"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "networkx>=3.2,<3.5",
    "dowhy>=0.12",
    "pymc>=5.16",
    "arviz>=0.19",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=15.0",
]

[dependency-groups]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
default-groups = ["notebook", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: PyMC sampling tests (deselect with -m 'not slow')"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
