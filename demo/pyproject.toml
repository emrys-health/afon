[project]
name = "synthetic-fhir-cancer-data-generator"
version = "0.1.0"
description = "Synthetic FHIR R4 cancer EHR generator "
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastparquet>=2025.7.0"
]


pythonpath = ["."]

filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]

line-length = 120
target-version = "py311"
