name: Build CLI
description: >
  Builds the afon-cli distribution, ie afon-distribution/target/afon-<version>-cli.zip, without the tests.
  The repository must be checked out first.  Sets up Java 17 and runs on any runner with bash.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
        cache: maven

    # The templates bootstrap the afon home.
    - name: Build the afon-cli
      shell: bash
      env:
        # The default heap is not enough for javac to open the spark jars.
        MAVEN_OPTS: -Xmx3g
      run: |
        set -euo pipefail
        AFON_BUILD_HOME="$RUNNER_TEMP/afon-build"
        mkdir -p "$AFON_BUILD_HOME/config"
        cp templates/config/* "$AFON_BUILD_HOME/config/"
        ./afon.sh --home "$AFON_BUILD_HOME" -a build -bg "clean package" -bp cli,distribution \
          -ba "-DskipTests -B -ntp"
