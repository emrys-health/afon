name: Publish

# Publishes the Maven artifacts to GitHub Packages and, for a release tag, creates the GitHub Release.
#
# Runs on demand (workflow_dispatch) to publish the artifacts of the chosen ref, eg a SNAPSHOT of main.
# No GitHub Release is created for a manual run.  Once the tag trigger below is enabled, it also runs when
# release.sh pushes the release tag afon-<version>, and then creates the GitHub Release.
#
# Runs on a GitHub-hosted runner, with the job's own token: it needs no secrets, and no self-hosted runner
# ever runs code from a tag or a fork.
on:
  # TODO: the tag trigger is disabled until the manual runs are proven.  Uncomment it to publish on release.
  # push:
  #   tags:
  #     - "afon-*"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and never cancel one in flight.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Same as the CLI workflow: the default heap is not enough for javac to open the spark jars.
  MAVEN_OPTS: -Xmx3g

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # To create the GitHub Release.
      contents: write
      # To publish to GitHub Packages.
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/afon-') }}
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$IS_TAG" == "true" ]; then
            TAG_VERSION="${REF_NAME#afon-}"
            if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
              echo "::error::Tag $REF_NAME does not match the project version $POM_VERSION"
              exit 1
            fi
          fi
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $POM_VERSION"

      # Profiles as in release.sh, plus github for the distribution management, minus acceptance, which needs
      # cloud credentials.  The deploy is skipped by default in the pom until released: -Dmaven.deploy.skip=false.
      # afon.sh runs mvn with the settings.xml of the repository, which reads GITHUB_USERNAME and GITHUB_TOKEN.
      - name: Build, test and deploy to GitHub Packages
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./afon.sh -a build -bp github,cli,distribution,-acceptance -bg "clean deploy" -ba "-B -Dmaven.deploy.skip=false"

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/afon-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The section of this version in release_notes.md, up to the next version.
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' release_notes.md > "$RUNNER_TEMP/notes.md"
          NOTES=(--notes-file "$RUNNER_TEMP/notes.md")
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::warning::No section for $VERSION in release_notes.md, generating the notes"
            NOTES=(--generate-notes)
          fi
          # A version with a qualifier, eg 1.0-beta-1, is a pre-release.
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "$TAG" "afon-distribution/target/afon-$VERSION-cli.zip" \
            --title "$VERSION" "${NOTES[@]}" "${PRERELEASE[@]}"
