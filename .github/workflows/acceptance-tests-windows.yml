name: Acceptance tests (Windows)

# Runs the afon-acceptance ScalaTest suite (default tags: Access, External, Forbidden — all
# three clouds) on a self-hosted Windows runner. These tests hit real AWS/Azure/GCP storage and
# spin up local KeyCloak/Polaris/Trino via Testcontainers, so the runner needs:
#   - Java 17, Maven, and a Docker daemon able to run Linux containers
#   - config/env*.properties reconstructed from the secrets below (see config/env*.properties.example)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: acceptance-tests-windows
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven and Docker are available
        run: |
          mvn -version
          docker version

      - name: Write env.properties secrets
        env:
          ENV_PROPERTIES: ${{ secrets.ENV_PROPERTIES }}
          ENV_AWS_PROPERTIES: ${{ secrets.ENV_AWS_PROPERTIES }}
          ENV_AZURE_PROPERTIES: ${{ secrets.ENV_AZURE_PROPERTIES }}
          ENV_GCP_PROPERTIES: ${{ secrets.ENV_GCP_PROPERTIES }}
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("config/env.properties", $env:ENV_PROPERTIES, $utf8NoBom)
          [System.IO.File]::WriteAllText("config/env-aws.properties", $env:ENV_AWS_PROPERTIES, $utf8NoBom)
          [System.IO.File]::WriteAllText("config/env-azure.properties", $env:ENV_AZURE_PROPERTIES, $utf8NoBom)
          [System.IO.File]::WriteAllText("config/env-gcp.properties", $env:ENV_GCP_PROPERTIES, $utf8NoBom)

      - name: Build (skip tests)
        run: mvn -B -ntp clean install -DskipTests

      - name: Run acceptance tests
        run: mvn -B -ntp -pl afon-acceptance test

      - name: Upload acceptance test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afon-acceptance-surefire-reports
          path: |
            afon-acceptance/target/surefire-reports/**
            afon-acceptance/scenarios.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove env.properties secrets
        if: always()
        run: |
          Remove-Item -Path config/env.properties, config/env-aws.properties, config/env-azure.properties, config/env-gcp.properties -ErrorAction SilentlyContinue
