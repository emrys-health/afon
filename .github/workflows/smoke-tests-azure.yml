name: smoke-tests-azure

# Runs the smoke tests of the Azure full stack, ie `afon-cli.sh smoke-test azure --setup azure-full --teardown`, in the afon-cli
# Docker image on a GitHub-hosted runner, by calling the smoke-tests workflow, which holds the steps that are the same for
# every cloud, see it, and docs/github_workflows.md for what to set up.
#
# Triggered by a new build of afon-cli, ie when the cli-release workflow completes successfully on main, which has published the
# images of the build too, so that the three smoke-tests-<cloud> workflows run downstream of it, concurrently, each testing
# the image of that build.
#
# For a build, the config env to test with is the repository variable SMOKE_TESTS_CONFIG_ENV, else emrys3, the env of the smoke
# tests, and the tag of its snapshot is SMOKE_TESTS_CONFIG_TAG, else current.  It can also be run by hand, with workflow_dispatch.
#
# The config is the snapshot pulled from the vault of the cloud with `config-vault pull <tag> --force`, for the config env.  When
# triggered by a build, the env and the tag are the repository variables SMOKE_TESTS_CONFIG_ENV and SMOKE_TESTS_CONFIG_TAG (default emrys3 and current); with
# workflow_dispatch, the inputs config_env and config_tag, which take precedence.  Run by hand, image_tag is the tag of the afon-cli
# image to test, blank for the project version of the ref run.
on:
  workflow_dispatch:
    inputs:
      config_env:
        description: "Config env (blank for the repository variable SMOKE_TESTS_CONFIG_ENV, else emrys3)"
        type: string
        default: ""
      config_tag:
        description: "Tag of the config snapshot in the vault (blank for the repository variable SMOKE_TESTS_CONFIG_TAG, else current)"
        type: string
        default: ""
      image_tag:
        description: "Tag of the afon-cli image to test, eg 1.0-SNAPSHOT (blank for the project version of the ref)"
        type: string
        default: ""
  # On every new build of the cli.
  workflow_run:
    workflows: ["cli-release"]
    types: [completed]
    branches: [main]

jobs:
  smoke-tests:
    # Only after a successful release of the cli and its images, when triggered by it.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # The most that the called workflow may use: the OIDC token for the cloud login, and the previous runs for Slack.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/smoke-tests.yml
    with:
      cloud: azure
      config_env: ${{ inputs.config_env || vars.SMOKE_TESTS_CONFIG_ENV || 'emrys3' }}
      config_tag: ${{ inputs.config_tag || vars.SMOKE_TESTS_CONFIG_TAG || 'current' }}
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
