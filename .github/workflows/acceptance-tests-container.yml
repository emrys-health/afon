name: acceptance-tests-container

# Runs the acceptance tests in container, in the afon-base image, on a GitHub-hosted runner.  acceptance-tests.yml, which runs them on the
# self-hosted runner, is left as it is.
#
# The specs assume that localhost is the Docker host: KeyCloak is bound at a fixed localhost:8080, Trino runs in host network mode and reaches
# it there, and the kind cluster is reached at localhost:<port>.  A `container:` job puts the job in a network of its own, and GitHub does not
# let it ask for the host's, so the commands run in a `docker run --network host` step instead, with the runner's docker socket: the containers
# the specs start are then siblings on the host, as when they are run from a shell on it.
#
# Like the smoke tests, it needs the config of an env: pulled from the vault of a cloud, with `config-vault pull <tag> --force`, after a login to
# the cloud by OIDC (a short-lived token, no stored credentials), so the specs find their config properties.
#
# We are using the GitHub environment smoke-tests-<cloud>, which the cloud trusts and which already has what the login needs; see docs/github_workflows.md.
# The environment is reused instead of creating a new acceptance-tests-<cloud>, as that would need a trust rule per cloud for another subject.
# The environment is created with the same variables, and the setup scripts (github-cloud-identity, github-cloud-env) and the name is conventional.
# The config is on the runner, in a directory that the container has, so that it can be masked in the log, which is
# public, and is removed at the end.
#
# What it runs:
#   project  the projects of the central identity, in a KeyCloak container (profile identity: the profile project runs the specs of the clouds
#            too, which use its tools and need its login)
#   signing  the signing and verification of images, in a kind cluster, which drives the docker client: the base image has none, so a static
#            build of the client is put in it for the run
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "The cloud whose vault holds the config, and whose login is used"
        type: choice
        options: [aws, azure, gcp]
        default: aws
      config_env:
        description: "The config env, ie the env of the snapshot in the vault (blank for the repository variable SMOKE_TESTS_CONFIG_ENV, else emrys2)"
        type: string
        default: ""
      config_tag:
        description: "The tag of the config snapshot in the vault (blank for the repository variable SMOKE_TESTS_CONFIG_TAG, else current)"
        type: string
        default: ""
      specs:
        description: "The specs to run"
        type: choice
        options: [project, signing, project and signing]
        default: project and signing
      image_tag:
        description: "The tag of the afon-base image, eg 1.0-SNAPSHOT (blank for the project version of the ref)"
        type: string
        default: ""
      image:
        description: "The afon-base image, without its tag"
        type: string
        default: emryshealth/afon-base
  push:
    branches: [main]
    paths:
      - "afon-*/**"
      - "scripts/**"
      - "templates/**"
  pull_request:
    branches: [main]
    paths:
      - "afon-*/**"
      - "scripts/**"
      - "templates/**"

permissions:
  contents: read

# Never two at once for a cloud: they share its config and its stores.
concurrency:
  group: acceptance-tests-container-${{ inputs.cloud || 'aws' }}
  cancel-in-progress: false

env:
  # The client that the signing test drives, as kind does, which the base image lacks; the daemon is the runner's.
  DOCKER_CLIENT_VERSION: "27.3.1"
  # As acceptance-tests.yml: no afon output on the console of the job, which is public, and room for javac to open the spark jars.
  AFON_LOGGING_CONSOLE: "OFF"
  MAVEN_OPTS: -Xmx3g

jobs:
  # The tag of the image: the project version, which the Docker workflow tags the images of the build with.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        if: ${{ inputs.image_tag == '' }}
        uses: actions/checkout@v7
        with:
          sparse-checkout: pom.xml
          sparse-checkout-cone-mode: false

      - name: Determine the image tag
        id: tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout -N)
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Running in the image ${{ inputs.image || 'emryshealth/afon-base' }}:$IMAGE_TAG"

  acceptance:
    needs: resolve
    runs-on: ubuntu-latest
    # The environment holds the variables of the cloud's login, and is the subject that the cloud's OIDC trust is limited to.
    environment: smoke-tests-${{ inputs.cloud || 'aws' }}
    timeout-minutes: 90
    permissions:
      contents: read
      # For the OIDC token that the cloud login exchanges.
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ${{ inputs.image || 'emryshealth/afon-base' }}:${{ needs.resolve.outputs.image_tag }}
      CLOUD: ${{ inputs.cloud || 'aws' }}
      CONFIG_ENV: ${{ inputs.config_env || vars.SMOKE_TESTS_CONFIG_ENV || 'emrys2' }}
      CONFIG_TAG: ${{ inputs.config_tag || vars.SMOKE_TESTS_CONFIG_TAG || 'current' }}
      # The environment's variables of the login, see docs/github_workflows.md: secrets of the environment, or the variables of the ones set up before.
      AWS_REGION: ${{ vars.AWS_REGION }}
      AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME || vars.AZURE_KEY_VAULT_NAME }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}

    steps:
      - name: Check the environment
        # The identifiers of the login, which are set in this step only: AWS_ROLE_ARN would otherwise be read by the aws cli in the later steps.
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          case "$CLOUD" in
            aws)   NAMES="AWS_ROLE_ARN AWS_REGION" ;;
            azure) NAMES="AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_KEY_VAULT_NAME" ;;
            gcp)   NAMES="GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID" ;;
          esac
          MISSING=""
          for NAME in $NAMES; do
            [ -n "${!NAME:-}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::The GitHub environment smoke-tests-$CLOUD has no value for:$MISSING, see docs/github_workflows.md"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      # On the runner, mounted in the container: the config, which the specs find in $AFON_HOME/config.  Set from RUNNER_TEMP in a step, as the
      # runner context is not available where the env of a job is given.
      - name: Locate the config dir
        run: echo "AFON_DIR=$RUNNER_TEMP/afon" >> "$GITHUB_ENV"

      # Each login is OIDC: a short-lived token for the identity that smoke-tests-<cloud> is trusted for, see docs/github_workflows.md.
      - name: Log in to AWS
        if: ${{ (inputs.cloud || 'aws') == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Log in to Azure
        if: ${{ (inputs.cloud || 'aws') == 'azure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to GCP
        if: ${{ (inputs.cloud || 'aws') == 'gcp' }}
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Log in to the gcloud cli
        if: ${{ (inputs.cloud || 'aws') == 'gcp' }}
        run: |
          set -euo pipefail
          gcloud auth login --cred-file="${{ steps.gcp-auth.outputs.credentials_file_path }}" --quiet
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Check the cloud login
        run: |
          set -euo pipefail
          case "$CLOUD" in
            aws)   aws sts get-caller-identity ;;
            azure) az account show --output none ;;
            gcp)   gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q . ;;
          esac

      # The maven repository of the container, kept between runs: the build downloads the dependencies of every module.
      - name: Cache the maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: acceptance-container-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: acceptance-container-m2-

      - name: Show the runner
        run: |
          set -euo pipefail
          docker version
          free -h
          df -h /
          nproc

      - name: Pull the image
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          # --entrypoint bash: the image's own makes a user and runs the command through `su`, which splits a script given to `bash -c`
          docker run --rm --entrypoint bash "$IMAGE" -c 'java -version 2>&1 | head -1; mvn -version | head -1; kind version; command -v docker || echo "no docker client"'

      # The config dir, which the container has as /tmp/afon.  Every command in the container is run by scripts/docker/afon/afon-docker.sh, which the
      # steps after this one source: it gives it the host network, so that localhost is the host's, the docker socket, so that the containers of the
      # specs are the host's, the workspace, the maven repository, the config dir, and what the cloud login left: AWS in its variables, Azure and
      # GCP in the files of their clis.  A developer runs the same before a commit, see docs/acceptance_tests.md.
      - name: Prepare the config dir
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2/repository" "$AFON_DIR"
          chmod 700 "$AFON_DIR"

      # The snapshot of the config, from the vault of the cloud, as the smoke tests pull it, into the config dir of the runner.  The launcher of
      # the scripts is that of the repository, which is the cli's, without the jar, as a script of the cloud needs none.
      - name: Pull the config from the vault
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/docker/afon/afon-docker.sh"
          afon_docker '
            set -euo pipefail
            ARGS=()
            case "$CLOUD" in
              aws)   ARGS=(--region "$AWS_REGION") ;;
              azure) [ -z "$AZURE_KEY_VAULT_NAME" ] || ARGS=(--vault "$AZURE_KEY_VAULT_NAME") ;;
              gcp)   ARGS=(--project "$GCP_PROJECT_ID") ;;
            esac
            /work/afon-cli/src/main/scripts/afon-cli-scripts.sh --home /tmp/afon --cloud "$CLOUD" --env "$CONFIG_ENV" \
              config-vault pull "$CONFIG_TAG" --force "${ARGS[@]}"
            # What the container wrote belongs to the runner user, which the steps on the runner read and remove
            chmod -R go-rwx /tmp/afon
            chown -R "$HOST_UID:$HOST_GID" /tmp/afon
          '

      # GitHub masks the secrets it knows of, and these are unknown to it: without this, a value that is printed is in the public log.
      - name: Mask the secrets of the config
        run: |
          set -euo pipefail
          mask() {
            local value="$1"
            value="${value%$'\r'}"; value="${value#\"}"; value="${value%\"}"
            # Short values (true, a port) would mask the log into unreadability.
            if [ "${#value}" -ge 8 ]; then echo "::add-mask::$value"; fi
          }
          for FILE in "$AFON_DIR/config-$CONFIG_ENV"/secret*.properties "$AFON_DIR/config-$CONFIG_ENV"/catalogs*.properties; do
            [ -f "$FILE" ] || continue
            while IFS= read -r LINE || [ -n "$LINE" ]; do
              case "$LINE" in \#*|"") continue ;; esac
              mask "${LINE#*=}"
              mask "$LINE"
            done < "$FILE"
          done

      # What the specs are given, in the profiles of afon-acceptance/pom.xml.  The project specs of the clouds are left out by selecting the package of
      # the specs of the containers only.
      - name: Choose the specs
        id: specs
        env:
          SPECS: ${{ inputs.specs || 'project and signing' }}
        run: |
          set -euo pipefail
          case "$SPECS" in
            project)               ARGS="-Pidentity" ;;
            signing)               ARGS="-Psigning" ;;
            "project and signing") ARGS="-Pidentity,signing" ;;
          esac
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Maven arguments: $ARGS"

      - name: Validate afon config
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/docker/afon/afon-docker.sh"
          afon_docker '/work/afon-cli/src/main/scripts/afon-cli-scripts.sh --home /tmp/afon --cloud "$CLOUD" config-validate'

      - name: Run the specs in the container
        env:
          ARGS: ${{ steps.specs.outputs.args }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/docker/afon/afon-docker.sh"
          afon_docker '
            set -euo pipefail
            # Whatever happens, what the container wrote belongs to the runner user, as the checkout and the cache of the maven repository are removed and read as it
            trap '"'"'chown -R "$HOST_UID:$HOST_GID" /work /root/.m2 /tmp/afon 2>/dev/null || true'"'"' EXIT
            # The docker client that the signing test drives, if the image has none.
            if ! command -v docker > /dev/null 2>&1; then
              curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLIENT_VERSION}.tgz" \
                | tar -xz --strip-components=1 -C /usr/local/bin docker/docker
            fi
            docker version --format "client {{.Client.Version}}, daemon {{.Server.Version}}"
            # The modules that the specs need are installed first, without their tests, as the scalatest plugin of the acceptance module is the one run.
            mvn -B -ntp -q -pl afon-acceptance -am -DskipTests install
            # The logs of the specs go to the file afon.log of the logs dir of the mounted AFON_HOME, not to the console, which is public and which they fill:
            # the pom hands these two to the JVM of the specs.  The logs store has them after.
            mvn -B -ntp -Dstyle.color=always -pl afon-acceptance test -Dafon.home=/tmp/afon -Dafon.logging.console=OFF $ARGS
          ' -e ARGS

      # The logs of the run, whatever its result, in the logs store of the cloud, which is private, as the job and its logs are lost when it ends and the
      # console of a public repo is public.  Read them with `logs-store list` and `logs-store pull <run id>-<attempt>`.  Before the config is removed,
      # which the store needs.  It cannot fail the job, but warns, eg if the cloud login has expired.
      - name: Store the logs in the logs store
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LOG_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/docker/afon/afon-docker.sh"
          afon_docker '/work/afon-cli/src/main/scripts/afon-cli-scripts.sh --home /tmp/afon --cloud "$CLOUD" --env "$CONFIG_ENV" logs-store push "$LOG_TAG"' -e LOG_TAG \
            || echo "::warning::The logs could not be stored in the logs store: they are lost with the job"

      # What the specs left in docker, to see whether they cleaned up.
      - name: Show the containers left
        if: ${{ always() }}
        run: |
          docker ps -a --format 'table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Names}}'

      # Only the reports: the logs carry config values, and the artifacts of a public repo are public.
      - name: Upload the reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: afon-acceptance-container-reports-${{ github.run_id }}
          path: afon-acceptance/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Remove afon config
        if: ${{ always() }}
        run: rm -rf "$AFON_DIR"
