name: Docker

# Builds the afon-base and afon-cli images from the released afon-cli zip and pushes them to Docker Hub
# (repository emryshealth), with scripts/docker/afon/build.sh --push.
# See docs/docker.md for the versions and tags.  Images are linux/amd64, as the GitHub-hosted runner is.
#
# Not triggered directly: it is called by the CLI Release workflow, once the zip is released, with the zip it built.
# The images are those of the version released: a SNAPSHOT of main for a snapshot, or the tagged release, which is
# tagged latest as well.  To publish the images of a ref by hand, run the CLI Release workflow on it.
#
# Runs on a GitHub-hosted runner, so no self-hosted runner ever runs code from a tag or a fork.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   - DOCKERHUB_USERNAME: the Docker Hub user that owns the access token below.  The user must be a member of the
#                         emryshealth organization, with a role that can push to its repositories.
#   - DOCKERHUB_TOKEN:    a Docker Hub personal access token of that user with 'Read & Write' scope
#                         (Docker Hub > Account settings > Personal access tokens).  Never the account password.
on:
  workflow_call:
    inputs:
      zip-artifact:
        description: The name of the artifact holding the afon-cli zip.
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the afon-cli zip
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.zip-artifact }}
          path: ${{ runner.temp }}/afon-cli-zip

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the images
        run: scripts/docker/afon/build.sh --push --zip "$(ls "$RUNNER_TEMP"/afon-cli-zip/*-cli.zip)"
