apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels:
    app: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      role: master
  template:
    metadata:
      labels:
        app: spark
        role: master
    spec:
      containers:
      - name: spark-master
        image: apache/spark
        command: ["/opt/entrypoint.sh", "driver"]
        ports:
        - containerPort: 7077
        - containerPort: 8080
        volumeMounts:
          - name: secrets-store
            mountPath: /etc/secrets     # secrets show up as files here
            readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "aws-sm-provider"