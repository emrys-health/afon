apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  labels:
    app: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      role: master
  template:
    metadata:
      labels:
        app: spark
        role: master
    spec:
      serviceAccountName: nginx-pod-identity-deployment-sa
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "nginx-pod-identity-deployment-aws-secrets"
      containers:
      - name: spark-master
        image: apache/spark
        command: ["/bin/bash","-c","/opt/spark/sbin/start-master.sh && while /opt/spark/sbin/spark-daemon.sh status org.apache.spark.deploy.master.Master 1; do sleep 1; done"]
        ports:
        - containerPort: 7077
        - containerPort: 8080
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      - name: spark-worker
        image: apache/spark
        command: [ "/bin/bash", "-c", "/opt/spark/sbin/start-worker.sh spark://spark-master-svc:7077 && while /opt/spark/sbin/spark-daemon.sh status org.apache.spark.deploy.worker.Worker 1; do sleep 1; done" ]
        ports:
          - containerPort: 8081

