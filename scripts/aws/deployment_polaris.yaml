apiVersion: v1
kind: Pod
metadata:
  name: polaris
  labels:
    app: polaris
spec:
  serviceAccountName: nginx-pod-identity-deployment-sa
  volumes:
    - name: secrets-store-inline
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "nginx-pod-identity-deployment-aws-secrets"
    - name: secrets-google
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "google-secrets"
  containers:
    - name: polaris
      image: apache/polaris:1.1.0-incubating
      command: [ "/bin/bash", "-c", "source /mnt/secrets-store/CloudDetails && /opt/jboss/container/java/run/run-java.sh" ]
      ports:
        - containerPort: 8181
        - containerPort: 8182
      volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
        - name: secrets-google
          mountPath: "/mnt/secrets-store-google"
          readOnly: true