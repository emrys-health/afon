apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  labels:
    app: polaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
      role: master
  template:
    metadata:
      labels:
        app: polaris
        role: master
    spec:
      serviceAccountName: nginx-pod-identity-deployment-sa
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "nginx-pod-identity-deployment-aws-secrets"
      containers:
      - name: polaris
        image: apache/polaris:1.1.0-incubating
#        command: ["/bin/bash", "-c", "/opt/spark/sbin/start-master.sh && while /opt/spark/sbin/spark-daemon.sh status org.apache.spark.deploy.master.Master 1; do sleep 1; done"]
        ports:
        - containerPort: 8181
        - containerPort: 8182
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
