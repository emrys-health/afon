apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-sm-provider
  namespace: default
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "arn:aws:secretsmanager:eu-west-2:123456789012:secret:phsecret-7dLRuU"
        objectType: "secretsmanager" # or "ssmparameter"
    usePodIdentity: "true"
