apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupiter-spark
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      containers:
        - name: jupiter-spark-container
          image: quay.io/jupyter/all-spark-notebook
          imagePullPolicy: IfNotPresent