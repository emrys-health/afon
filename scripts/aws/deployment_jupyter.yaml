apiVersion: v1
kind: Pod
metadata:
  name: jupyter-notebook
  labels:
    app: jupyter
spec:
  containers:
    - name: jupyter
      image: jupyter/pyspark-notebook:x86_64-spark-3.5.0
      ports:
        - containerPort: 8888
      env:
        - name: SPARK_MASTER
          value: "k8s://https://kubernetes.default.svc"
        - name: SPARK_CONF_DIR
          value: "/home/jovyan/"
        - name: SPARK_HOME
          value: "/usr/local/spark"
        - name: PYSPARK_PYTHON
          value: "python3"
