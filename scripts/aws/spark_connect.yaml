# Uses our bespoke Spark image that uses Python 3.11 so Jupyter can integrate with it
# Build it with:
# docker build -t ph1ll1phenry/spark-3.5-py311 .
# docker push  ph1ll1phenry/spark-3.5-py311
# in the directory of the appropriate Docker file

apiVersion: spark.apache.org/v1
kind: SparkApplication
metadata:
  name: emrys2
spec:
  runtimeVersions:
    sparkVersion: "4.0.1"
  mainClass: "org.apache.spark.sql.connect.service.SparkConnectServer"
  sparkConf:
    spark.kubernetes.container.image: "apache/spark:4.0.1"
    spark.master.ui.title: "Prod Spark Cluster"
    spark.master.rest.enabled: "true"
    spark.master.rest.host: "0.0.0.0"
    spark.ui.reverseProxy: "true"
    spark.master: "spark://emrys-master-svc:7077"
    spark.submit.deployMode: "cluster"
    spark.executor.cores: "1"
    spark.cores.max: "3"
    spark.kubernetes.authenticate.driver.serviceAccountName: "nginx-pod-identity-deployment-sa"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.driver.allowMultipleContexts: "true"
    spark.sql.iceberg.planning.preserve-data-grouping: "true"
    spark.sql.sources.v2.bucketing.enabled: "true"
    spark.sql.sources.bucketing.enabled: "true"
    spark.sql.catalog.aws.uri: "http://a3bf58d9f5c894d499b21b9e1cf25859-2059064440.eu-west-2.elb.amazonaws.com:8181/api/catalog"
    spark.sql.catalog.aws.client_secret: "***REMOVED***"
    spark.sql.catalog.aws.warehouse: "aws"
    spark.sql.catalog.aws.type: "rest"
    spark.sql.catalog.aws.oauth2.token: "***REMOVED_JWT***"
    spark.sql.catalog.aws.client_id: "043313aae219f0de"
    spark.sql.catalog.aws.rest.auth.oauth2.scope: "PRINCIPAL_ROLE:ALL"
    spark.sql.catalog.aws.cache-enabled: "false"
    spark.sql.catalog.aws: "org.apache.iceberg.spark.SparkCatalog"
    spark.sql.catalog.aws.scope: "PRINCIPAL_ROLE:ALL"
    spark.sql.catalog.aws.token: "***REMOVED_JWT***"
    spark.sql.catalog.aws.credential: "***REMOVED***"
    spark.sql.catalog.aws.header.X-Iceberg-Access-Delegation: "vended-credentials"
    spark.jars.packages: "com.google.guava:guava:33.4.0-jre,org.apache.hadoop:hadoop-aws:3.4.2,com.google.cloud:google-cloud-storage:2.57.0,software.amazon.awssdk:bundle:2.34.6,org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.0"
    spark.driver.userClassPathFirst: "true"
    spark.executor.userClassPathFirst: "true"
    spark.driver.extraJavaOptions: "-Divy.home=/opt/spark/"
  driverSpec:
#    serviceAccountName: nginx-pod-identity-deployment-sa
    podTemplateSpec:
      spec:
        containers:
          - volumeMounts:
              - name: "secrets-store-inline"
                mountPath: "/etc/secrets"
                readOnly: true
        volumes:
          - name: secrets-store-inline
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: "nginx-pod-identity-deployment-aws-secrets"