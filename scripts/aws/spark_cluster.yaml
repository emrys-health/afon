# Uses our bespoke Spark image that uses Python 3.11 so Jupyter can integrate with it
# Build it with:
# docker build -t ph1ll1phenry/spark-3.5-py311 .
# docker push  ph1ll1phenry/spark-3.5-py311
# in the directory of the appropriate Docker file

apiVersion: spark.apache.org/v1alpha1
kind: SparkCluster
metadata:
  name: emrys
spec:
  runtimeVersions:
    sparkVersion: "4.0.1"
  clusterTolerations:
    instanceConfig:
      initWorkers: 2
      minWorkers: 2
      maxWorkers: 2
  sparkConf:
    spark.kubernetes.container.image: "apache/spark:4.0.1"
    spark.master.ui.title: "Prod Spark Cluster"
    spark.master.rest.enabled: "true"
    spark.master.rest.host: "0.0.0.0"
    spark.ui.reverseProxy: "true"
#    imagePullPolicy: Always
