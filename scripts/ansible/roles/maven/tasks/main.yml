---
# Maven comes from apt at the version pinned in scripts/local/pinned.sh, and held, as `afon-cli.sh local-setup` does on linux.
- name: Install maven {{ maven_version }}
  ansible.builtin.apt:
    name: "maven={{ maven_version }}*"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true

- name: Hold maven, so that upgrades leave it alone
  ansible.builtin.dpkg_selections:
    name: maven
    selection: hold

# What an earlier version of this role installed from the Apache archive, which would shadow the apt maven.
- name: Remove the maven installed from the Apache archive
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/mvn
    - /opt/maven
    - /etc/profile.d/afon-maven.sh
