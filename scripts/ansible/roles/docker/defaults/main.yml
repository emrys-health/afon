---
docker_key_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
docker_keyring: /etc/apt/keyrings/docker.asc
docker_repo_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# The runner service caches its environment, so it is bounced after the runner
# user is added to the docker group. Set to false to restart it by hand.
restart_runner_service: true
