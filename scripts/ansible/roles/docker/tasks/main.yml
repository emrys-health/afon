---
# The acceptance specs start KeyCloak, Polaris, Trino and Spark Connect through
# Testcontainers, so the runner user needs a docker daemon it can talk to.
- name: Fetch the docker signing key
  ansible.builtin.get_url:
    url: "{{ docker_key_url }}"
    dest: "{{ docker_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the docker apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ apt_arch }} signed-by={{ docker_keyring }}]
      {{ docker_repo_url }} {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true

# The engine and its cli are pinned to the version in scripts/local/pinned.sh, ie the newest package version
# starting with it (apt versions have an epoch and a release suffix, eg 5:29.9.1-1~ubuntu.26.04~resolute).
- name: Install the docker engine {{ docker_version }}
  ansible.builtin.apt:
    name: "{{ docker_packages | map('regex_replace', '^(docker-ce(-cli)?)$', '\\1=5:' ~ docker_version ~ '*') | list }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true

- name: Hold the docker engine packages, so that upgrades leave them alone
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli

- name: Enable and start the docker daemon
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add {{ github_runner_user }} to the docker group
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    groups: docker
    append: true
  register: afon_docker_group

# Our own ssh session was opened before the group was added, so it still carries
# the old group set — without this, the docker checks in the verify role fail
# with a permission denied on the socket.
- name: Reconnect so this play picks up the docker group
  ansible.builtin.meta: reset_connection

- name: Find the installed actions runner services
  ansible.builtin.shell:
    cmd: set -o pipefail && systemctl list-units --type=service --all --plain --no-legend 'actions.runner.*' | awk '{print $1}'
    executable: /bin/bash
  register: afon_runner_services
  changed_when: false
  check_mode: false

# Without this the runner keeps the group memberships it had at boot, and
# docker calls from the workflow fail with a permission denied on the socket.
- name: Restart the actions runner services to pick up the docker group
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ afon_runner_services.stdout_lines | select | list }}"
  when:
    - restart_runner_service | bool
    - afon_docker_group is changed
