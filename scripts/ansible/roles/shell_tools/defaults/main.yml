---
# Shell tooling used by afon.sh, scripts/config/*.sh and the workflow steps:
#   curl   - runner + actions downloads
#   unzip  - afon.sh config-import / docs-export, tool installers
#   perl   - scripts/config/validate.sh
#   acl    - lets ansible drop privileges to the runner user cleanly
#   libicu - required by the actions runner binary
shell_tools_packages:
  - acl
  - apt-transport-https
  - ca-certificates
  - coreutils
  - curl
  - gnupg
  - libicu-dev
  - lsb-release
  - nodejs
  - npm
  - perl
  - rsync
  - tar
  - unzip
  - wget
  - zip

# Seconds an existing apt cache is considered fresh enough to reuse.
apt_cache_valid_time: 3600

# Installed separately, at the versions pinned in scripts/local/pinned.sh, and held:
#   git - actions/checkout
#   jq  - json wrangling in the ops scripts
