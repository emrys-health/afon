---
- name: Install the aws cli
  when: install_awscli | bool
  block:
    - name: Check whether the aws cli is already installed
      ansible.builtin.command: aws --version
      register: afon_aws_version
      changed_when: false
      failed_when: false

    - name: Download and unpack the aws cli installer
      ansible.builtin.unarchive:
        src: "{{ awscli_url }}"
        dest: /tmp
        remote_src: true
        creates: /tmp/aws/install
      when: afon_aws_version.rc != 0 or ('aws-cli/' ~ awscli_version) not in afon_aws_version.stdout

    - name: Run the aws cli installer
      ansible.builtin.command: /tmp/aws/install --update
      register: afon_aws_install
      changed_when: afon_aws_install.rc == 0
      when: afon_aws_version.rc != 0 or ('aws-cli/' ~ awscli_version) not in afon_aws_version.stdout

    - name: Remove the aws cli installer
      ansible.builtin.file:
        path: /tmp/aws
        state: absent

- name: Install the azure cli
  when: install_azurecli | bool
  block:
    - name: Fetch the microsoft signing key
      ansible.builtin.get_url:
        url: "{{ azure_key_url }}"
        dest: "{{ azure_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add the azure cli apt repo
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ apt_arch }} signed-by={{ azure_keyring }}]
          {{ azure_repo_url }} {{ ansible_facts['distribution_release'] }} main
        filename: azure-cli
        state: present
        update_cache: true

    # Pinned to the version in scripts/local/pinned.sh, ie the newest package version starting with it, and held.
    - name: Install azure-cli {{ azurecli_version }}
      ansible.builtin.apt:
        name: "azure-cli={{ azurecli_version }}*"
        state: present
        allow_downgrade: true

    - name: Hold azure-cli, so that upgrades leave it alone
      ansible.builtin.dpkg_selections:
        name: azure-cli
        selection: hold

- name: Install the gcloud cli
  when: install_gcloud | bool
  block:
    - name: Fetch the google cloud signing key
      ansible.builtin.get_url:
        url: "{{ gcloud_key_url }}"
        dest: "{{ gcloud_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add the google cloud apt repo
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ apt_arch }} signed-by={{ gcloud_keyring }}]
          {{ gcloud_repo_url }} cloud-sdk main
        filename: google-cloud-sdk
        state: present
        update_cache: true

    # The gke auth plugin, needed by kubectl to authenticate to GKE, has the same version as gcloud.
    - name: Install google-cloud-cli {{ gcloud_version }} and its gke auth plugin
      ansible.builtin.apt:
        name:
          - "google-cloud-cli={{ gcloud_version }}*"
          - "google-cloud-cli-gke-gcloud-auth-plugin={{ gcloud_version }}*"
        state: present
        allow_downgrade: true

    - name: Hold google-cloud-cli and its gke auth plugin, so that upgrades leave them alone
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - google-cloud-cli
        - google-cloud-cli-gke-gcloud-auth-plugin

- name: Install kubectl {{ kubectl_version }}
  when: install_kubectl | bool
  block:
    - name: Check the installed kubectl version
      ansible.builtin.command: kubectl version --client
      register: afon_kubectl_version
      changed_when: false
      failed_when: false

    - name: Download kubectl
      ansible.builtin.get_url:
        url: "{{ kubectl_url }}"
        dest: /usr/local/bin/kubectl
        owner: root
        group: root
        mode: "0755"
        force: true
      when: "afon_kubectl_version.rc != 0 or ('Client Version: ' ~ kubectl_version) not in afon_kubectl_version.stdout"

- name: Install opentofu {{ opentofu_version }}
  when: install_opentofu | bool
  block:
    - name: Check the installed opentofu version
      ansible.builtin.command: tofu --version
      register: afon_tofu_version
      changed_when: false
      failed_when: false

    - name: Download and unpack opentofu
      ansible.builtin.unarchive:
        src: "{{ opentofu_url }}"
        dest: /usr/local/bin
        remote_src: true
        include:
          - tofu
        owner: root
        group: root
        mode: "0755"
      when: afon_tofu_version.rc != 0 or ('OpenTofu v' ~ opentofu_version) not in afon_tofu_version.stdout
