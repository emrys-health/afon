---
# Site-level settings for the self-hosted Linux runners.
# Everything else lives in the role defaults (roles/*/defaults/main.yml).

# The user the GitHub Actions runner service runs as. It is added to the docker
# group, so that Testcontainers can talk to the daemon from the workflow.
github_runner_user: ubuntu
github_runner_home: /home/ubuntu

# Java 17 flavour: 'openjdk' (distro packages) or 'temurin' (Adoptium apt repo).
# The workflow provisions its own Temurin 17 via actions/setup-java, so this is
# the JDK used when running the build by hand on the runner.
java_distribution: openjdk

# The versions of the tools are pinned in scripts/local/pinned.sh, which local-setup shares with this playbook,
# so that local and runner setups are the same.  The linux pins apply, as the playbook may run from another platform.
afon_pinned_sh: "{{ playbook_dir }}/../local/pinned.sh"
afon_pinned_versions: "{{ lookup('ansible.builtin.pipe', 'bash ' ~ afon_pinned_sh ~ ' linux java git jq mvn docker kubectl tofu yq helm hubble aws eksctl kubelogin az gcloud') }}"
afon_pinned: "{{ dict(afon_pinned_versions.splitlines() | map('split', '=') | list) }}"

# java, git, jq, maven and the cloud clis are installed with apt, as `afon-cli.sh local-setup` does on linux, at these versions
# (the newest apt version containing them), and held.  The other tools are release downloads.
java_version: "{{ afon_pinned.java }}"
git_version: "{{ afon_pinned.git }}"
jq_version: "{{ afon_pinned.jq }}"
maven_version: "{{ afon_pinned.mvn }}"
docker_version: "{{ afon_pinned.docker }}"
kubectl_version: "v{{ afon_pinned.kubectl }}"
opentofu_version: "{{ afon_pinned.tofu }}"
awscli_version: "{{ afon_pinned.aws }}"
yq_version: "{{ afon_pinned.yq }}"
helm_version: "{{ afon_pinned.helm }}"
hubble_version: "{{ afon_pinned.hubble }}"
eksctl_version: "{{ afon_pinned.eksctl }}"
kubelogin_version: "{{ afon_pinned.kubelogin }}"
azurecli_version: "{{ afon_pinned.az }}"
gcloud_version: "{{ afon_pinned.gcloud }}"

# The acceptance tests reach the clouds through the SDKs, not the CLIs, so the
# cloud tooling is off by default. Turn it on for a runner that also runs the
# ops/tofu actions of afon.sh.
install_cloud_tools: false

# Extra volumes attached to the runner, pooled into one LVM group and carved up
# by the lvm role (see its defaults for the volumes and their sizes). Left
# empty, the role leaves the runner's storage alone.
lvm_devices: []
# lvm_devices:
#   - /dev/xvdf

# Architecture names, as used by apt (amd64/arm64) and by the tarball
# downloads (x86_64/aarch64). Derived from the host facts.
apt_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
