# Application Credentials
# GOOGLE_APPLICATION_CREDENTIALS=$(tr -d '\n' < ~/.config/gcloud/application_default_credentials.json)
GOOGLE_APPLICATION_CREDENTIALS=
# HMAC credentials needed to reach the storage buckets
# cli: gcloud storage hmac create $GCP_SERVICE_ACCOUNT
# the accessId and secret from the output of the command above: the secret is shown only when the key is created
GCP_HMAC_ACCESS_ID=
GCP_HMAC_SECRET=
