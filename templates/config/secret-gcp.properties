# Application Credentials
# GOOGLE_APPLICATION_CREDENTIALS=$(tr -d '\n' < ~/.config/gcloud/application_default_credentials.json)
GOOGLE_APPLICATION_CREDENTIALS=
# HMAC credentials needed to reach the storage buckets
# set by gcp-create, if it creates the key, as the secret is shown only when the key is created; or by hand, from the metadata.accessId
# and secret of: gcloud storage hmac create $GCP_SERVICE_ACCOUNT --format='value(metadata.accessId,secret)'
GCP_HMAC_ACCESS_ID=
GCP_HMAC_SECRET=
