# TRE whitelist: the only domain names that the notebooks, the Spark master and the Spark driver can resolve, so any name
# they use must be listed.  It is a security control, so there is no default: keep only what your deployment needs.
#
# A section per cloud (aws, azure, gcp) lists what that cloud's stack needs, and "common" what any cloud needs.  Each has:
#   domains:  domain names, spelled out (no URLs).  A name with * is a pattern, where * stands for one label.
#   catalogs: (clouds only) templates expanded once for each catalog of the cloud that has a bucket.
#
# ${NAME} is replaced by the value of that property.  In a cloud's section, ${POLARIS_DOMAIN_NAME}, ${JUPYTER_DOMAIN_NAME}
# and ${OIDC_DOMAIN_NAME} are the cloud's own, eg AWS_POLARIS_DOMAIN_NAME in "aws".  In "catalogs", ${BUCKET_NAME} is the
# catalog's bucket.  An entry with a property that is not set is left out, so a cloud you do not deploy to needs no
# properties.  Write the lists in block style, as above: a ${NAME} in a [flow, list] is not valid YAML.  The smoke tests only check the domains of the TRE cloud, TRE_CLOUD.
common:
  domains: []

aws:
  domains:
    - ${OIDC_DOMAIN_NAME}
    - ${POLARIS_DOMAIN_NAME}
    - ${JUPYTER_DOMAIN_NAME}
  catalogs:
    - ${BUCKET_NAME}.s3.${AWS_REGION}.amazonaws.com

azure:
  domains:
    - ${OIDC_DOMAIN_NAME}
    - ${POLARIS_DOMAIN_NAME}
    - ${JUPYTER_DOMAIN_NAME}
    - ${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net

gcp:
  domains:
    - ${OIDC_DOMAIN_NAME}
    - ${POLARIS_DOMAIN_NAME}
    - ${JUPYTER_DOMAIN_NAME}
    - storage.googleapis.com
