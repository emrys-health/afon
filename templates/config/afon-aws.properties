# Account
AWS_ACCOUNT_ID=
# Region
AWS_REGION=

# S3 storage
AWS_S3_ROLE_ARN=
AWS_S3_BUCKET_NAME=
AWS_S3_BUCKET_NAME_TRINO=
AWS_S3_BUCKET_NAME_EXTERNAL=
AWS_S3_BUCKET_NAME_FORBIDDEN=
AWS_S3_BUCKET_NAME_FORBIDDEN_BY_POLARIS=

# Glue catalogs
AWS_GLUE_ROLE_ARN=
AWS_GLUE_CATALOG_NAME=

# Polaris domain name
AWS_POLARIS_DOMAIN_NAME=
# Jupyter domain name
AWS_JUPYTER_DOMAIN_NAME=

# DNS zones
AWS_POLARIS_DNS_ZONE=
AWS_JUPYTER_DNS_ZONE=
AWS_KEYCLOAK_DNS_ZONE=

# Elastic IP that all outbound traffic from the cluster egresses from.
# Optional: set it to an Elastic IP already allocated in this account to keep the same
# address across rebuilds.  Left empty, a new one is allocated on apply and released on
# destroy.  See docs/cluster.md#egress-ip-aws.
AWS_EGRESS_IP=

# Cert ARNs
AWS_KEYCLOAK_CERT_ARN=
AWS_JUPYTER_CERT_ARN=
AWS_POLARIS_CERT_ARN=

