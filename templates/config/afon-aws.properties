# Account
AWS_ACCOUNT_ID=
# Region
AWS_REGION=

# S3 storage (see catalogs-aws.properties for the S3 catalogs)
AWS_S3_ROLE_ARN=

# Glue catalogs (see catalogs-aws.properties for the "aws_glue" catalog)
AWS_GLUE_ROLE_ARN=

# S3 bucket for Gitea's LFS objects, attachments, packages etc, kept under gitea/<cluster>/.
# Gitea reaches it with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.  Required by aws-full, whose create script makes it.
AWS_GITEA_BUCKET=
# S3 bucket that Fluent Bit ships Polaris' logs to, under polaris/<cluster>/, so that they outlive the cluster.
# Optional: no logs are shipped when empty.  See docs/cluster.md#polaris-logs-in-s3-aws.
AWS_POLARIS_LOG_BUCKET=

# Registry that docker-image --sign mirrors the images that are not ours to and signs them in, eg 123456789012.dkr.ecr.eu-west-2.amazonaws.com/emrys
# Optional: the images are not signed without it.
AWS_IMAGE_REGISTRY=
# The cosign key that signs them, as cosign sign --key takes it, eg awskms:///alias/afon-image-signing.  Only the deployer role can use it.
# It can also be a key file, eg one generated by afon-cli.sh signing-public-key aws in $AFON_HOME/cosign/aws, to try signing without a KMS
# (its password, if any, in the environment variable COSIGN_PASSWORD).
# Optional: the images are not signed without it.
AWS_COSIGN_KEY=
# The public key of AWS_COSIGN_KEY, its base64 without the PEM lines (no space: the shell sources this file), which Kyverno verifies the images with
# Set it with afon-cli.sh signing-public-key aws, which writes it here from AWS_COSIGN_KEY, or from a key pair it generates if that is empty.
# Optional: Kyverno deploys with no image policy when empty.
AWS_COSIGN_PUBLIC_KEY=
# Comma-separated namespaces in which Kyverno rejects the pods that have an image that is not signed with AWS_COSIGN_KEY, eg default.
# Optional: none, ie the images are only audited.
AWS_IMAGE_POLICY_ENFORCED_NAMESPACES=

# OIDC domain name
# Optional: OIDC_DOMAIN_NAME when empty.  Set it for the aws stacks to keep a Keycloak, DNS zone and certificate of their own.
AWS_OIDC_DOMAIN_NAME=
# Whether the stacks otherwise deploying their own KeyCloak, eg aws-full, use instead the one at OIDC_DOMAIN_NAME
# that the aws-keycloak stack deploys, so that they can run side by side with it.
# Optional: false when empty.  See docs/stacks.md#stacks-side-by-side.
AWS_KEYCLOAK_EXTERNAL=false
# Polaris domain name
AWS_POLARIS_DOMAIN_NAME=
# Jupyter domain name
AWS_JUPYTER_DOMAIN_NAME=
# Comma-separated CIDRs to admit to Polaris, eg 203.0.113.7/32,198.51.100.0/24.  Optional: left empty, Polaris is open to all.
# Applied as the inbound-cidrs of its ALB, via the alb.ingress.kubernetes.io/inbound-cidrs annotation of its ingress.  The egress IP
# of the cluster (AWS_EGRESS_IP below) is added automatically, as its pods calling Polaris by its public domain name come back in through the ALB from it.
# See docs/cluster.md#restricting-who-can-reach-polaris-aws.
AWS_POLARIS_ALLOWED_CIDRS=
# Elastic IP that all outbound traffic from the cluster egresses from.
# Optional: set it to an Elastic IP already allocated in this account to keep the same
# address across rebuilds.  Left empty, a new one is allocated on apply and released on
# destroy.  See docs/cluster.md#egress-ip-aws.
AWS_EGRESS_IP=


