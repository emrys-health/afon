# APP_NAME=AfonMultiTenantApp
# Tenant ID
# cli: az account tenant list --query "[].tenantId" -o tsv
AZURE_TENANT_ID=
# App ID
# cli: az ad app list --display-name $APP_NAME --query "[].appId" -o tsv
AZURE_APP_ID=
# App Secret
# cli: az ad app credential reset --id $APP_ID
# Required, unless AZURE_WORKLOAD_IDENTITY=true, when it is ignored
AZURE_APP_SECRET=
# Set to true if the app registration has a federated credential, which trusts the OIDC issuer of the AKS cluster, instead of a
# secret: Polaris then runs under a service account that AKS workload identity exchanges for a token of the app.
# See azure-identity.  It is never inferred from a blank AZURE_APP_SECRET.
AZURE_WORKLOAD_IDENTITY=false
# App SP ID
# cli: az ad sp show --id $APP_ID --query id -o tsv
AZURE_SP_ID=
# Connection String
# cli: az storage account show-connection-string --name $AZURE_STORAGE_ACCOUNT --resource-group $AZURE_RESOURCE_GROUP  --query "connectionString" -o tsv
# Only needed for AzureReader, and by azure-full for the monitoring, where Loki keeps its logs in the container of the
# azure catalog
AZURE_CONNECTION_STRING=
# CA credentials used to register the CA cert issuer.
# Only needed for scripts/azure/issue-cert.sh digicert|globalsign
AZURE_CA_ID=
AZURE_CA_PASSWORD=
# Databricks Token
# cli: databricks tokens create --lifetime-seconds 31536000 --comment "CLI Token"
# Only needed if using Databricks
AZURE_DATABRICKS_TOKEN=
