# APP_NAME=AfonMultiTenantApp
# Tenant ID
# cli: az account tenant list --query "[].tenantId" -o tsv
AZURE_TENANT_ID=
# App ID
# cli: az ad app list --display-name $APP_NAME --query "[].appId" -o tsv
AZURE_CLIENT_ID=
# App Secret
# cli: az ad app credential reset --id $APP_ID
AZURE_CLIENT_SECRET=
# App SP ID
# cli: az ad sp show --id $APP_ID --query id -o tsv
AZURE_SP_ID=
# Connection String
# cli: az storage account show-connection-string --name $AZURE_STORAGE_ACCOUNT --resource-group $AZURE_RESOURCE_GROUP  --query "connectionString" -o tsv
# Only needed for AzureReader
AZURE_CONNECTION_STRING=
# CA credentials used to register the CA cert issuer.
# Only needed for scripts/azure/issue-cert.sh digicert|globalsign
AZURE_CA_ID=
AZURE_CA_PASSWORD=
# Databricks Token
# cli: databricks tokens create --lifetime-seconds 31536000 --comment "CLI Token"
# Only needed if using Databricks
DATABRICKS_TOKEN=
# OAUTH2
# Optional config for Jupyter MFA
# Only needed for stack including Jupyter
AZURE_OAUTH2_CLIENT_ID=
AZURE_OAUTH2_CLIENT_SECRET=
***REMOVED***
