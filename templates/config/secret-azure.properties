# AZURE_CLIENT_ID from portal: Active Directory > App Registrations > AfonMultiTenantApp
# or : az ad app list --display-name AfonMultiTenantApp --query "[].appId" -o tsv
AZURE_CLIENT_ID=
# TENANT_ID from portal: Active Directory > App Registrations > AfonMultiTenantApp
# or: az account tenant list --query "[].tenantId" -o tsv
AZURE_TENANT_ID=
# AZURE_CLIENT_SECRET are generated in portal:  Active Directory > App Registrations > AfonMultiTenantApp > secrets
# Azure never re-exposes an existing secret's value, so we can only reset the secret
# az ad app credential reset --id $APP_ID
AZURE_CLIENT_SECRET=
# AZURE_CONNECTION_STRING from portal:  Storage account > Security & Networking > Access Keys
AZURE_CONNECTION_STRING=
# DATABRICKS_TOKEN from: databricks tokens create --lifetime-seconds 31536000 --comment "CLI Token"
DATABRICKS_TOKEN=
# OAUTH2
AZURE_OAUTH2_CLIENT_ID=
AZURE_OAUTH2_CLIENT_SECRET=
AZURE_OAUTH2_COOKIE_SECRET=
