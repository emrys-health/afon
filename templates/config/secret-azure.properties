# APP_NAME=AfonMultiTenantApp
# AZURE_CLIENT_ID from portal: Active Directory > App Registrations > APP_NAME
# cli: az ad app list --display-name $APP_NAME --query "[].appId" -o tsv
AZURE_CLIENT_ID=
# TENANT_ID from portal: Active Directory > App Registrations > APP_NAME
# cli: az account tenant list --query "[].tenantId" -o tsv
AZURE_TENANT_ID=
# AZURE_CLIENT_SECRET are generated in portal:  Active Directory > App Registrations > APP_NAME > secrets
# Azure never re-exposes an existing secret's value, so we can only reset the secret
# cli: az ad app credential reset --id $APP_ID
# The APP_ID is the AZURE_CLIENT_ID above
# The secret is contained in the 'password' field
AZURE_CLIENT_SECRET=
# AZURE_CONNECTION_STRING from portal:  Storage account > Security & Networking > Access Keys
AZURE_CONNECTION_STRING=
# DATABRICKS_TOKEN from: databricks tokens create --lifetime-seconds 31536000 --comment "CLI Token"
DATABRICKS_TOKEN=
# OAUTH2
AZURE_OAUTH2_CLIENT_ID=
AZURE_OAUTH2_CLIENT_SECRET=
***REMOVED***
