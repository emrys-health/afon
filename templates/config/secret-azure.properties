AZURE_CLIENT_ID=
# TENANT_ID from portal: Active Directory > App Registrations > AfonMultiTenantApp
# or: az ad app credential reset --id $AZURE_CLIENT_ID
AZURE_TENANT_ID=
# AZURE_CLIENT_SECRET from portal:  Active Directory > App Registrations > AfonMultiTenantApp > secrets
AZURE_CLIENT_SECRET=
***REMOVED***
# DATABRICKS_TOKEN from: databricks tokens create --lifetime-seconds 31536000 --comment "CLI Token"
DATABRICKS_TOKEN=
