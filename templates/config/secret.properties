# Polaris db for metadata
POLARIS_DB_HOST=
POLARIS_DB_USERNAME=postgres
POLARIS_DB_PASSWORD=
POLARIS_ID=
POLARIS_SECRET=

# User that clients authenticate as, eg to get its OIDC token.
# One of the users in users.csv, whose password is read from there.
USER_ID=

# Keycloak
KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=
KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=
KEYCLOAK_DB=postgres
KEYCLOAK_DB_URL=jdbc:postgresql://${POLARIS_DB_HOST}:5432/keycloak
KEYCLOAK_DB_USERNAME=postgres
KEYCLOAK_DB_PASSWORD=
# The user and password for the SMTP server of KEYCLOAK_SMTP_HOST, if it asks for them
KEYCLOAK_SMTP_USERNAME=
KEYCLOAK_SMTP_PASSWORD=

# Guacamole for video session storage
GUACAMOLE_DB_HOST=
GUACAMOLE_DB_USERNAME=
GUACAMOLE_DB_PASSWORD=

# Gitea, whose metadata goes in the Postgres database gitea_<cluster> (created if absent) at GITEA_DB_HOST
GITEA_DB_HOST=${POLARIS_DB_HOST}
GITEA_DB_USERNAME=postgres
GITEA_DB_PASSWORD=
# One of disable, require, verify-ca or verify-full.  Optional: require when empty.
GITEA_DB_SSL_MODE=
# Size of the volume holding the git repositories, eg 20Gi.  Optional: 10Gi when empty.
GITEA_STORAGE_SIZE=
GITEA_ADMIN_USERNAME=gitea_admin
GITEA_ADMIN_PASSWORD=

# OAuth2 (for Pomerium and JupyterHub)
OAUTH2_CLIENT_ID=
OAUTH2_CLIENT_SECRET=
# Used by JupyterHub to derive its proxy token, cookie secret and auth_state key
OAUTH2_COOKIE_SECRET=
# Pomerium gateway secrets, 32 random bytes base64-encoded (eg: head -c32 /dev/urandom | base64)
POMERIUM_SHARED_SECRET=
POMERIUM_COOKIE_SECRET=
JUPYTER_VNC_PASSWORD=

# Snowflake
SNOWFLAKE_PRIVATE_KEY=

