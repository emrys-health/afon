# Env name
# Can be used in other properties, eg CLUSTER_NAME=${ENV_NAME}-cluster
ENV_NAME=
# Kubernetes cluster
CLUSTER_NAME=${ENV_NAME}-cluster
# DNS wait timeout, eg '30s', '2m30s', '20m', '1h', '1h30m'.  Optional, defaults to '20m'
DNS_WAIT_TIMEOUT=
# Tofu output, one of 'console' (logged and written to console) or 'logger' (only logged).  Optional, defaults to 'logger'
TOFU_OUTPUT=
# Polaris
POLARIS_ENDPOINT=localhost:8181
# Polaris namespace. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE
POLARIS_NAMESPACE=
# Polaris namespace external. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE_EXTERNAL
POLARIS_NAMESPACE_EXTERNAL=
# Polaris table name. Optional, defaults to OpsDefaults#POLARIS_TABLE_NAME
POLARIS_TABLE_NAME=

# TRE allowed domains, as comma-separated list: the only names the notebooks, the Spark master and the Spark driver can resolve,
# so any name they use must be listed, spelled out, one domain name per entry (no wildcards, no URLs).  List those of
# the clouds deployed to:
# - always the OIDC domain name, OIDC_DOMAIN_NAME
# - AWS:   the Polaris and Jupyter domain names, AWS_POLARIS_DOMAIN_NAME and AWS_JUPYTER_DOMAIN_NAME, and the S3 bucket of each
#          catalog, <bucket>.s3.<AWS_REGION>.amazonaws.com
# - Azure: the Polaris and Jupyter domain names, AZURE_POLARIS_DOMAIN_NAME and AZURE_JUPYTER_DOMAIN_NAME, and the storage account,
#          ${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net
# - GCP:   the Polaris and Jupyter domain names, GCP_POLARIS_DOMAIN_NAME and GCP_JUPYTER_DOMAIN_NAME, and storage.googleapis.com
# eg, with the defaults of afon-azure.properties, for the Azure stacks:
# ALLOWED_DOMAINS_CSV=emrysoauth.click,${ENV_NAME}polarisazure.click,${ENV_NAME}jupyterazure.click,${ENV_NAME}afonstorageaccount.blob.core.windows.net
# No default: the list is a security control, so it is set per environment.
ALLOWED_DOMAINS_CSV=
# TRE cloud, ie the cloud of the stack hosting the TRE (eg aws-full), one of aws|azure|gcp. Optional, defaults to aws
TRE_CLOUD=aws

# The workspace identity, labelled on the notebook pods for an auditor.  Optional, each label stamped only when set
AUDIT_AE_ID=
AUDIT_PROJECT_ID=
AUDIT_COMMISSIONING_ORGANIZATION_ID=
AUDIT_TRE_ID=

# Branding theme to deploy for Guacamole and Keycloak, one of afon-theme's themes/<name>/
# subdirectories. Optional, defaults to "emrys-hdrs".
AFON_THEME=emrys-hdrs

# OIDC
# Domain name of the OIDC provider (eg Keycloak)
OIDC_DOMAIN_NAME=emrysoauth.click
# Protocol, defaults to https if omitted. Tests may set http.
OIDC_PROTOCOL=https
# Issuer URL
OIDC_ISSUER_URL=https://${OIDC_DOMAIN_NAME}/realms/polaris
# Email domains
OIDC_EMAIL_DOMAIN=*

# Snowflake
SNOWFLAKE_JDBC_URL=

# Spark Connect
# URL for the Spark Connect server. Optional, defaults to "sc://localhost:15002/;token=deadbeef"
SPARK_CONNECT_URL=
