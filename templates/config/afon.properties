# Env name
# Can be used in other properties, eg CLUSTER_NAME=${ENV_NAME}-cluster
ENV_NAME=
# Kubernetes cluster
CLUSTER_NAME=${ENV_NAME}-cluster
# DNS wait timeout, eg '30s', '2m30s', '20m', '1h', '1h30m'.  Optional, defaults to '20m'
DNS_WAIT_TIMEOUT=
# Tofu output, one of 'console' (logged and written to console) or 'logger' (only logged).  Optional, defaults to 'logger'
TOFU_OUTPUT=
# How to reach Polaris, one of 'port-forward' (through a tunnel to its pod, as kubectl port-forward does, which needs
# no access through its ingress) or 'https' (through its public domain name, which its ingress may restrict: the setup then admits
# this machine until it ends).  Optional, defaults to 'port-forward'
POLARIS_ACCESS=
# Polaris endpoint
POLARIS_ENDPOINT=localhost:8181
# Polaris namespace. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE
POLARIS_NAMESPACE=
# Polaris namespace external. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE_EXTERNAL
POLARIS_NAMESPACE_EXTERNAL=
# Polaris table name. Optional, defaults to OpsDefaults#POLARIS_TABLE_NAME
POLARIS_TABLE_NAME=

# TRE allowed domains: see whitelist.yaml.  Deprecated: this comma-separated list of domain names is only used, for any cloud,
# if whitelist.yaml is missing.
ALLOWED_DOMAINS_CSV=
# TRE cloud, ie the cloud of the stack hosting the TRE (eg aws-full), one of aws|azure|gcp. Optional, defaults to aws
TRE_CLOUD=aws

# The workspace identity, labelled on the notebook pods for an auditor.  Optional, each label stamped only when set
AUDIT_AE_ID=
AUDIT_PROJECT_ID=
AUDIT_COMMISSIONING_ORGANIZATION_ID=
AUDIT_TRE_ID=

# Branding theme to deploy for Guacamole and Keycloak, one of afon-theme's themes/<name>/
# subdirectories. Optional, defaults to "emrys-hdrs".
AFON_THEME=emrys-hdrs

# OIDC
# Domain name of the OIDC provider (eg Keycloak)
OIDC_DOMAIN_NAME=emrysoauth.click
# Protocol, defaults to https if omitted. Tests may set http.
OIDC_PROTOCOL=https
# Issuer URL, in which [OIDC_DOMAIN_NAME] stands for the OIDC domain name of the cloud, ie its <CLOUD>_OIDC_DOMAIN_NAME if set.
# The host must be the OIDC domain name of the cloud.
OIDC_ISSUER_URL=https://[OIDC_DOMAIN_NAME]/realms/polaris
# Email domains
OIDC_EMAIL_DOMAIN=*

# Snowflake
SNOWFLAKE_JDBC_URL=

# Spark Connect
# URL for the Spark Connect server. Optional, defaults to "sc://localhost:15002/;token=deadbeef"
SPARK_CONNECT_URL=
