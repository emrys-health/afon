# Env name
# Can be used in other properties, eg CLUSTER_NAME=${ENV_NAME}-cluster
ENV_NAME=
# Kubernetes cluster
CLUSTER_NAME=${ENV_NAME}-cluster
# DNS wait timeout, eg '30s', '2m30s', '20m', '1h', '1h30m'.  Optional, defaults to '20m'
DNS_WAIT_TIMEOUT=
# Tofu output, one of 'console' (logged and written to console) or 'logger' (only logged).  Optional, defaults to 'logger'
TOFU_OUTPUT=
# Whether manage-stack keeps the tofu state and plan of each stack in the object storage of its cloud (S3, Blob Storage or
# Cloud Storage), as the command cdktf-store does, under the tag 'current': pushed after each deploy, whether or not it succeeds,
# and removed after each delete.  A failure to store it is only a warning.  It needs the cloud CLI logged in with access to the
# store, which is created on first use, and a cdktf env (see cdktf-switch).  The state holds secrets in plain text.
# Optional: 'false' when empty
CDKTF_STORE_ENABLED=
# How to reach Polaris, one of 'port-forward' (through a tunnel to its pod, as kubectl port-forward does, which needs
# no access through its ingress) or 'https' (through its public domain name, which its ingress may restrict: the setup then admits
# this machine until it ends).  Optional, defaults to 'port-forward'
POLARIS_ACCESS=
# Polaris endpoint
POLARIS_ENDPOINT=localhost:8181
# Polaris namespace. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE
POLARIS_NAMESPACE=
# Polaris namespace external. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE_EXTERNAL
POLARIS_NAMESPACE_EXTERNAL=
# Polaris table name. Optional, defaults to OpsDefaults#POLARIS_TABLE_NAME
POLARIS_TABLE_NAME=

# TRE allowed domains: see whitelist.yaml.  Deprecated: this comma-separated list of domain names is only used, for any cloud,
# if whitelist.yaml is missing.
ALLOWED_DOMAINS_CSV=
# TRE cloud, ie the cloud of the stack hosting the TRE (eg aws-full), one of aws|azure|gcp. Optional, defaults to aws
TRE_CLOUD=aws

# The workspace identity, labelled on the notebook pods for an auditor.  Optional, each label stamped only when set
AUDIT_AE_ID=
AUDIT_PROJECT_ID=
AUDIT_COMMISSIONING_ORGANIZATION_ID=
AUDIT_TRE_ID=

# Name of the Spark cluster, from which the master and workers are named <name>-master and <name>-worker.
# A lowercase DNS label. Optional, defaults to "spark" when empty. Changing it on a deployed stack replaces the
# Spark cluster and the Spark Connect server on the next deploy.
SPARK_CLUSTER_NAME=

# Registry that the images of Kyverno are pulled from, set as the chart's global.image.registry, which moves every image of the
# chart, so it must have them all.  Optional, defaults to the chart's own, reg.kyverno.io, when empty.  Set it to ghcr.io, which
# has the same images, if reg.kyverno.io is down, and deploy again.  The signing acceptance test uses it too.
KYVERNO_IMAGE_REGISTRY=

# Branding theme to deploy for Guacamole and Keycloak, one of afon-theme's themes/<name>/
# subdirectories. Optional, defaults to "emrys-hdrs".
AFON_THEME=emrys-hdrs

# OIDC
# Domain name of the OIDC provider (eg Keycloak)
OIDC_DOMAIN_NAME=emrysoauth.click
# Protocol, defaults to https if omitted. Tests may set http.
OIDC_PROTOCOL=https
# Issuer URL, in which [OIDC_DOMAIN_NAME] stands for the OIDC domain name of the cloud, ie its <CLOUD>_OIDC_DOMAIN_NAME if set.
# The host must be the OIDC domain name of the cloud.
OIDC_ISSUER_URL=https://[OIDC_DOMAIN_NAME]/realms/polaris
# What setting up the Jupyter of a cloud does to the redirect URIs that its browser client already has: replace them with its own, or merge its own into them.
# One of replace or merge.  Optional: replace when empty.  Set merge for clouds that share this Keycloak realm, and so the client, eg a test env that sets up several
# at once.  The redirect URIs of a cloud that is no longer deployed then stay, until purge-redirect-uris takes them off.
OIDC_REDIRECT_STRATEGY=
# Email domains
OIDC_EMAIL_DOMAIN=*
# The SMTP server that Keycloak sends its emails through, eg the invitations of the members of a project.  Set it in the env of the Keycloak,
# with KEYCLOAK_SMTP_USERNAME and KEYCLOAK_SMTP_PASSWORD in secret.properties.  With no host, it sends none.  The port is 587 and the security
# starttls (or ssl, or none) when empty.
KEYCLOAK_SMTP_HOST=
KEYCLOAK_SMTP_PORT=
KEYCLOAK_SMTP_FROM=
KEYCLOAK_SMTP_SECURITY=
# The following are set by manage-project-stack from project.yaml, in the config-<project> dir of a project: leave them empty otherwise.
# The project's immutable id, eg xyz-yyyy-nnnn
PROJECT_ID=
# The kubeconfig of the cluster of the identity project, through which the stacks configure its Keycloak by a port-forward
KEYCLOAK_KUBECONFIG=
# The cloud of that cluster, when it is not the cloud of the stacks that use the identity, eg azure for a Data Provider on Azure that uses an identity on aws
KEYCLOAK_CLOUD=
# The clients of the project's TRE and Git, which the consumers of its tokens require in their audience
OIDC_AUDIENCE=
OIDC_GIT_AUDIENCE=
# The value of the acr (authentication context class reference) claim that proves MFA, eg mfa, and the claims naming a token's project
# and user (project and polaris_principal when empty)
OIDC_ACR=
OIDC_PROJECT_CLAIM=
OIDC_USER_CLAIM=
# The domain of the project's Git
GIT_DOMAIN_NAME=
# The time of the nightly teardown of the project's TRE, as HH:mm, and its time zone (Europe/London when empty)
TRE_TEARDOWN_TIME=
TRE_TEARDOWN_TIME_ZONE=

# Snowflake
SNOWFLAKE_JDBC_URL=

# Spark Connect
# URL for the Spark Connect server. Optional, defaults to "sc://localhost:15002/;token=deadbeef"
SPARK_CONNECT_URL=
