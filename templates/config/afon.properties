# Kubernetes cluster
CLUSTER_NAME=
# Polaris endpoint
POLARIS_ENDPOINT=

# OIDC
OIDC_ISSUER_URL=
OIDC_EMAIL_DOMAIN=*

# KEYCLOAK
KC_HOSTNAME=
# Public scheme KeyCloak advertises in its issuer URLs. Defaults to https if omitted; behind the
# AWS load balancer (which terminates TLS) this must be https so oauth2-proxy accepts the issuer.
KC_PROTOCOL=
# Whether browser logins must present a TOTP second factor. Only interactive logins (oauth2-proxy,
# JupyterHub) are affected; Spark/Trino direct grants are never asked for one.
KC_MFA_ENABLED=true

# SNOWFLAKE
SNOWFLAKE_JDBC_URL=
