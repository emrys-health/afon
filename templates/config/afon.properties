# Env name
# Optional, can be used in other properties, eg CLUSTER_NAME=${ENV_NAME}-cluster
ENV_NAME=
# Kubernetes cluster
CLUSTER_NAME=${ENV_NAME}-cluster
# Polaris endpoint
POLARIS_ENDPOINT=localhost:8181
# TRE allowed domains, as comma-separated list
ALLOWED_DOMAINS_CSV=
# Active Afon catalogs, as comma-separated list. Optional, defaults to the full built-in catalog set.
AFON_CATALOGS_CSV=

# Keycloak
# Hostname
KC_HOSTNAME=emrysoauth.click
# Protocol, defaults to https if omitted
KC_PROTOCOL=https

# OIDC
# Issuer URL
OIDC_ISSUER_URL=https://${KC_HOSTNAME}/realms/polaris
# Email domains
OIDC_EMAIL_DOMAIN=*

# Snowflake
SNOWFLAKE_JDBC_URL=
