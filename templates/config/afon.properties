# Env name
# Can be used in other properties, eg CLUSTER_NAME=${ENV_NAME}-cluster
ENV_NAME=
# Kubernetes cluster
CLUSTER_NAME=${ENV_NAME}-cluster
# DNS wait timeout, eg '30s', '2m30s', '20m', '1h', '1h30m'.  Optional, defaults to '20m'
DNS_WAIT_TIMEOUT=
# Polaris
POLARIS_ENDPOINT=localhost:8181
# Polaris namespace. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE
POLARIS_NAMESPACE=
# Polaris namespace external. Optional, defaults to OpsDefaults#POLARIS_NAMESPACE_EXTERNAL
POLARIS_NAMESPACE_EXTERNAL=
# Polaris table name. Optional, defaults to OpsDefaults#POLARIS_TABLE_NAME
POLARIS_TABLE_NAME=

# TRE allowed domains, as comma-separated list
ALLOWED_DOMAINS_CSV=

# Branding theme to deploy for Guacamole and Keycloak, one of afon-theme's themes/<name>/
# subdirectories. Optional, defaults to "emrys-hdrs".
AFON_THEME=emrys-hdrs

# OIDC
# Domain name of the OIDC provider (eg Keycloak)
OIDC_DOMAIN_NAME=emrysoauth.click
# Protocol, defaults to https if omitted. Tests may set http.
OIDC_PROTOCOL=https
# Issuer URL
OIDC_ISSUER_URL=https://${OIDC_DOMAIN_NAME}/realms/polaris
# Email domains
OIDC_EMAIL_DOMAIN=*

# Snowflake
SNOWFLAKE_JDBC_URL=

# Spark Connect
# URL for the Spark Connect server. Optional, defaults to "sc://localhost:15002/;token=deadbeef"
SPARK_CONNECT_URL=
