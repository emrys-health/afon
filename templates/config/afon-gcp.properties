# Project the GCP stacks are deployed into, eg afon-core
GCP_PROJECT_ID=
# Service Account
GCP_SERVICE_ACCOUNT=
# User account granted impersonation rights on the service account (optional)
GCP_USER_ACCOUNT=
# Region
GCP_REGION=europe-west2
# GCS bucket for Gitea's LFS objects, attachments, packages etc, kept under gitea/<cluster>/
GCP_GITEA_BUCKET=

# Registry that docker-image --sign mirrors the images that are not ours to and signs them in, eg europe-west2-docker.pkg.dev/<project>/emrys
# Optional: the images are not signed without it.
GCP_IMAGE_REGISTRY=
# The cosign key that signs them, as cosign sign --key takes it, eg gcpkms://projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>.  Only the deployer role can use it.
# It can also be a key file, eg one generated by afon-cli.sh signing-public-key gcp in $AFON_HOME/cosign/gcp, to try signing without a KMS
# (its password, if any, in the environment variable COSIGN_PASSWORD).
# Optional: the images are not signed without it.
GCP_COSIGN_KEY=
# The public key of GCP_COSIGN_KEY, its base64 without the PEM lines (no space: the shell sources this file), which Kyverno verifies the images with
# Set it with afon-cli.sh signing-public-key gcp, which writes it here from GCP_COSIGN_KEY, or from a key pair it generates if that is empty.
# Optional: Kyverno deploys with no image policy when empty.
GCP_COSIGN_PUBLIC_KEY=
# Comma-separated namespaces in which Kyverno rejects the pods that have an image that is not signed with GCP_COSIGN_KEY, eg default.
# Optional: none, ie the images are only audited.
GCP_IMAGE_POLICY_ENFORCED_NAMESPACES=

# Whether to store/restore the TLS cert in Secret Manager.  Unlike an Azure Key Vault, GCP Secret Manager
# has no named vault to configure: the secrets live directly in GCP_PROJECT_ID, so this is a plain on/off switch.
# If true, deploy restores the cached cert (if any) instead of requesting a new one from Let's Encrypt.
# If false or blank, the cached cert is ignored.
GCP_SECRETS_ENABLED=false
# OIDC domain name
# Optional: OIDC_DOMAIN_NAME when empty.  Set it for the gcp stacks to keep a Keycloak, DNS zone and certificate of their own.
GCP_OIDC_DOMAIN_NAME=
# Polaris domain name
GCP_POLARIS_DOMAIN_NAME=
# Jupyter domain name
GCP_JUPYTER_DOMAIN_NAME=
# Comma-separated CIDRs to admit to Polaris, eg 203.0.113.7/32,198.51.100.0/24.  Optional: left empty, Polaris is open to all.
# Applied as the whitelist-source-range of its nginx ingress, with the controller's service set to externalTrafficPolicy Local to
# preserve the callers' IPs.  The cluster's pod range, node subnet and pinned GCP_EGRESS_IP are added automatically, as its pods
# calling Polaris by its public domain name reach the ingress from them.  See docs/cluster.md#restricting-who-can-reach-polaris-gcp.
GCP_POLARIS_ALLOWED_CIDRS=
# Address that all outbound traffic from the cluster egresses from, through its Cloud NAT, so that a third party can put the cluster
# on an allow-list across rebuilds.  It must be that of a regional, external static IP created beforehand in GCP_PROJECT_ID and
# GCP_REGION ('afon-cli.sh gcp-egress-ip create'), which the stack looks up rather than manages, so that a destroy leaves it allocated.
# Only a stack that pins its egress IP (pinnedEgressIp in stacks.yaml) uses it, as an address serves one Cloud NAT at a time.
# Optional: left empty, Google allocates the addresses, which a rebuild changes.  See docs/cluster.md#egress-ip-gcp.
GCP_EGRESS_IP=
