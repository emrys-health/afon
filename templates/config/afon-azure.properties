# Subscription ID
AZURE_SUBSCRIPTION=
# Region
AZURE_REGION=
# Resource group
AZURE_RESOURCE_GROUP=Test-DataFabric
# Roles that grant Microsoft.Authorization/roleAssignments/write (and /delete),
# pipe-separated and quoted if it contains spaces, as it's sourced in azure/rbac.sh.
# create.sh/destroy.sh require the current principal to hold one of these to manage role assignments.
# Narrow to a single role (eg "User Access Administrator") for envs that grant only that role,
# PIM-eligible and condition-restricted.
# Optional, defaults to roles set in azure/rbac.sh.
AZURE_GRANT_ROLES=
# Resource providers tofu should auto-register: none, legacy, core, extended, or all.
AZURE_RESOURCE_PROVIDER_REGISTRATIONS=none
# AKS node pool, expressed as comma-separated key:value pairs, eg "vmSize:Standard_D4s_v6,nodeCount:2". Do not wrap the value in quotes -
# java.util.Properties keeps them as literal characters rather than stripping them like a shell would.
# A semicolon separator is still accepted, but this file is also read by shell scripts, to which it ends a command: escape it as \;
# Recognised keys: nodeCount (default 3), vmSize (default Standard_D2s_v3).
# Any key can be omitted to keep its default - eg "vmSize:Standard_D2s_v6" alone is valid.
# NOTE: azure-full does not fit on the default nodes: 4 x Standard_D2s_v3 left pods such as the Spark Connect driver Pending (Insufficient cpu).
# Use larger nodes, eg "vmSize:Standard_D4s_v6,nodeCount:2".  Check a count or size with kube-estimator.
# Optional, defaults to the values above.
AZURE_AKS_NODE_POOL=
# Storage account name
AZURE_STORAGE_ACCOUNT=${ENV_NAME}afonstorageaccount
# Blob container for Gitea's LFS objects, attachments, packages etc, kept under gitea/<cluster>/.
# Gitea reaches it with the account and key of AZURE_CONNECTION_STRING.  Required by azure-full, whose create script makes it.
AZURE_GITEA_BUCKET=

# Registry that docker-image --sign mirrors the images that are not ours to and signs them in, eg <name>.azurecr.io/emrys
# Optional: the images are not signed without it.
AZURE_IMAGE_REGISTRY=
# The cosign key that signs them, as cosign sign --key takes it, eg azurekms://<vault>.vault.azure.net/<key>.  Only the deployer role can use it.
# Optional: the images are not signed without it.
AZURE_COSIGN_KEY=
# The public key of AZURE_COSIGN_KEY, its base64 without the PEM lines (no space: the shell sources this file), which Kyverno verifies the images with
# (cosign public-key --key <the key>).  Optional: Kyverno deploys with no image policy when empty.
AZURE_COSIGN_PUBLIC_KEY=
# Comma-separated namespaces in which Kyverno rejects the pods that have an image that is not signed with AZURE_COSIGN_KEY, eg default.
# Optional: none, ie the images are only audited.
AZURE_IMAGE_POLICY_ENFORCED_NAMESPACES=
# Bucket for where Polaris logs are to be stored persistently
AZURE_POLARIS_LOG_BUCKET=
# Name of a Key Vault in AZURE_RESOURCE_GROUP, used to store the TLS cert.
# Leave blank to disable storing the cert.   If set, name must be unique globally.
AZURE_KEY_VAULT_NAME=${ENV_NAME}-afon-key-vault
# OIDC domain name
# Optional: OIDC_DOMAIN_NAME when empty.  Set it for the azure stacks to keep a Keycloak, DNS zone and certificate of their own.
AZURE_OIDC_DOMAIN_NAME=
# Polaris domain name
AZURE_POLARIS_DOMAIN_NAME=${ENV_NAME}polarisazure.click
# Jupyter domain name
AZURE_JUPYTER_DOMAIN_NAME=${ENV_NAME}jupyterazure.click
# Comma-separated CIDRs to admit to Polaris, eg 203.0.113.7/32,198.51.100.0/24.  Optional: left empty, Polaris is open
# to all.  Applied as the whitelist-source-range of its nginx ingress, with the controller's service set to
# externalTrafficPolicy Local to preserve the callers' IPs.  The cluster's pod CIDR is added automatically, as its pods
# calling Polaris by its public domain name reach the ingress from their own IPs.  See docs/cluster.md#restricting-who-can-reach-polaris-azure.
AZURE_POLARIS_ALLOWED_CIDRS=
# Public IP address that all outbound traffic from the cluster egresses from, so that a third party can put the cluster on an
# allow-list across rebuilds.  It must belong to a Standard SKU, static public IP created beforehand in AZURE_RESOURCE_GROUP,
# which the stack then looks up rather than manages, so that a destroy leaves it allocated.  Create it with 'afon-cli.sh azure-egress-ip create'.  Only a stack that pins its egress IP
# (pinnedEgressIp in stacks.yaml) uses it, as a public IP can serve one cluster's outbound traffic only.
# Optional: left empty, Azure allocates an address, which a rebuild changes.  See docs/cluster.md#egress-ip-azure.
AZURE_EGRESS_IP=
# Whether the stacks otherwise deploying their own KeyCloak, eg azure-full, use instead the one at OIDC_DOMAIN_NAME
# that the azure-keycloak stack deploys, so that they can run side by side with it.
# Optional: false when empty.  See docs/stacks.md#stacks-side-by-side.
AZURE_KEYCLOAK_EXTERNAL=false
