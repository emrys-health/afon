# Subscription ID
AZURE_SUBSCRIPTION=
# Region
AZURE_REGION=
# Resource group
AZURE_RESOURCE_GROUP=Test-DataFabric
# create or lookup existing group
# NOTE: if group is created it becomes terraform-managed and destroy upon tofu destroy
# TODO: remove and leave only lookup mechanism relying on azure/create.sh
AZURE_RESOURCE_GROUP_ACTION=
# TODO: remove as only required if we support create?
AZURE_PROVIDER_REGISTRATION_SKIP=true
# Storage account name
AZURE_STORAGE_ACCOUNT=${ENV_NAME}afonstorageaccount
# Storage bucket names
AZURE_BUCKET=afonstorage
AZURE_EXTERNAL_BUCKET=${AZURE_BUCKET}-2
AZURE_BUCKET_FORBIDDEN=${AZURE_BUCKET}-forbidden
# Name of a Key Vault in AZURE_RESOURCE_GROUP, used to store the TLS cert.
# Leave blank to disable storing the cert.   If set, name must be unique globally.
AZURE_KEY_VAULT_NAME=${ENV_NAME}-afon-key-vault
# Polaris domain name
AZURE_DOMAIN_NAME=${ENV_NAME}polarisazure.click
# Jupyter domain name
AZURE_JUPYTER_DOMAIN_NAME=${ENV_NAME}jupyterazure.click
