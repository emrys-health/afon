# See catalogs.properties for the format.
GCP_CATALOG_IDS=gcp,gcp_external,gcp_forbidden

GCP_CATALOG_NAME_gcp=gcp
GCP_CATALOG_TYPE_gcp=internal
GCP_BUCKET_NAME_gcp=${ENV_NAME}-afon-bucket
GCP_ADMIN_GRANTS_gcp=true

# gcp_external's bucket is assumed externally-owned: scripts/gcp/create.sh and destroy.sh never
# create/delete it, and its grant goes to a different principal (external-sa) than gcp/gcp_forbidden
# (my-vendable-sa) - see GCP_CATALOG_TYPE_gcp_external=external above.
GCP_CATALOG_NAME_gcp_external=gcp_external
GCP_CATALOG_TYPE_gcp_external=external
GCP_BUCKET_NAME_gcp_external=${ENV_NAME}-afon-bucket-external
GCP_ADMIN_GRANTS_gcp_external=true

GCP_CATALOG_NAME_gcp_forbidden=gcp_forbidden
GCP_CATALOG_TYPE_gcp_forbidden=internal
GCP_BUCKET_NAME_gcp_forbidden=${ENV_NAME}-afon-bucket-forbidden
GCP_ADMIN_GRANTS_gcp_forbidden=false
