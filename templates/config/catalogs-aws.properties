# See catalogs.properties for the format.
AWS_CATALOG_NAMES=aws,aws_trino,aws_external,aws_forbidden

AWS_CATALOG_NAME_aws=aws
AWS_CATALOG_TYPE_aws=internal
AWS_BUCKET_NAME_aws=${ENV_NAME}-afon-bucket
AWS_ADMIN_GRANTS_aws=true

AWS_CATALOG_NAME_aws_trino=aws_trino
AWS_CATALOG_TYPE_aws_trino=internal
AWS_BUCKET_NAME_aws_trino=${ENV_NAME}-afon-bucket-trino
AWS_ADMIN_GRANTS_aws_trino=true

AWS_CATALOG_NAME_aws_external=aws_external
AWS_CATALOG_TYPE_aws_external=external
AWS_BUCKET_NAME_aws_external=${ENV_NAME}-afon-bucker-external
AWS_ADMIN_GRANTS_aws_external=true

AWS_CATALOG_NAME_aws_forbidden=aws_forbidden
AWS_CATALOG_TYPE_aws_forbidden=internal
AWS_BUCKET_NAME_aws_forbidden=${ENV_NAME}-afon-bucker-forbidden
AWS_ADMIN_GRANTS_aws_forbidden=false

# To also configure a Glue-backed catalog: add "aws_glue" to AWS_CATALOG_NAMES above, set
# AWS_GLUE_ROLE_ARN/AWS_GLUE_CATALOG_NAME in afon-aws.properties, and set
# AWS_CATALOG_TYPE_aws_glue=glue here (registered explicitly in PolarisCatalogManager).

# Used only by AcceptanceTestConfig for its own "aws_forbidden" test catalog - distinct from
# AWS_BUCKET_NAME_aws_forbidden above so the two don't collide if both are configured in the
# same test run.
AWS_S3_BUCKET_NAME_FORBIDDEN=
