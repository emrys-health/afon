# Catalog definitions, per cloud (see catalogs-<cloud>.properties).
# Format, for cloud <CLOUD> (AWS, AZURE or GCP):
#
#   <CLOUD>_CATALOG_NAMES=<id>,<id>,...                (required to activate any catalog for that cloud)
#
#   <CLOUD>_CATALOG_NAME_<id>=<name>                   (optional, defaults to <id>) the catalog's
#                                                       actual Polaris-facing name - only needs
#                                                       setting when it must differ from <id>
#   <CLOUD>_CATALOG_TYPE_<id>=internal|external|<...>  (required) "internal"/"external" are built
#                                                       generically from the two properties below;
#                                                       anything else must be registered as an
#                                                       explicit factory in PolarisCatalogManager
#                                                       (eg "glue")
#   <CLOUD>_BUCKET_NAME_<id>=<bucket name>             the storage bucket for internal/external
#                                                       catalogs
#   <CLOUD>_ADMIN_GRANTS_<id>=true|false               (optional, defaults to true)
#
# Adding a new internal/external catalog needs no code change: add its id to <CLOUD>_CATALOG_NAMES
# and its properties above. A new TYPE needs a small Java class plus one factory registration -
# every catalog of that type from then on is pure configuration too.
