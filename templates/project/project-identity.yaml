# The central identity: the one Keycloak that signs users in for every project, deployed by a project of its own.  Made by
#   afon-cli.sh manage-project init ${id} --role identity ${cloud} --made-from ${env}
# Complete what is in <angle brackets>, then check it, configure it and bring it up:
#   afon-cli.sh manage-project validate ${id}
#   afon-cli.sh manage-project configure ${id}
#   afon-cli.sh manage-project up ${id}
# See docs/projects.md.
project:
  id: ${id}
  cloud: ${cloud}
  role: identity
  # the env whose config the project is made from: where it deploys (account, region, domain names, secrets) is that env's
  env: ${env}
  # the address its cluster leaves from, reserved apart from its stack so that a rebuild keeps it: afon-cli.sh ${cloud}-egress-ip create <name>
  egressIp: <egress-ip>

# its domain is that of the env with the project's id as a label after the first, eg azure-oidc.emrys2.click is azure-oidc.${id}.emrys2.click:
# the TRE projects name it in identity.issuerUrl.  To give it another, uncomment and edit:
# stacks:
#   identity:
#     domain: azure-oidc.${id}.example.org

# how the DNS zone of its domain is delegated from the parent domain: manual (or none, or no value), where you delegate by hand: up does not
# stop, so run it with --until create, add the NS records that dns-delegate shows to the parent zone, then run the rest; or route53, where
# up writes them to the Route 53 hosted zone of the parent domain, in the current AWS account, and runs through
dns:
  delegation: none

# the nodes of its cluster, which runs Keycloak only: adjust to the quota of the subscription (AWS has no node pool property, so
# there the nodes are those of the env)
cluster:
  nodePool: ${nodePool}
