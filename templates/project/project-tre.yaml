# A trusted research environment, which signs its users in with the central identity.  Made by
#   afon-cli.sh manage-project init ${id} --role tre ${cloud}
# Complete what is in <angle brackets>, then check it, configure it and bring it up:
#   afon-cli.sh manage-project validate ${id}
#   afon-cli.sh manage-project plan ${id}
#   afon-cli.sh manage-project configure ${id}
#   afon-cli.sh manage-project up ${id}
# The secret of its TRE client, which configure needs, is made by: afon-cli.sh project-secret ${id} tre
# See docs/projects.md.
project:
  id: ${id}
  cloud: ${cloud}
  # the env whose config the project is made from: where it deploys (account, region, domain names, secrets) is that env's
  env: ${env}
  # the address its cluster leaves from, reserved apart from its stack so that a rebuild keeps it: afon-cli.sh ${cloud}-egress-ip create <name>.  One
  # address serves one cluster, so each project that runs next to another needs its own, which also leaves the env's for a deployment of the env itself
  egressIp: <egress-ip>

identity:
  # the identity project that deploys the central identity, so that up can reach its admin API for the registration
  project: <identity-project>
  issuerUrl: https://<identity-domain>/realms/polaris
  # the authentication context class reference that proves a second factor
  acr: mfa

# the catalogs of the Data Providers that the project reads, in one or both of two lists.  named has the catalogs of a Data Provider that is one of Afon's
# projects (with the role data): the endpoint, the audience and the storage are taken from that project, which must be made, with its env's config there,
# and the entry for each catalog has the id <data-project>-<catalog>.  defined has a Data Provider that is not one of Afon's, in full
dataProviders:
  # uncomment to name the catalogs of a Data Provider's project, and remove the entry of defined if the project has no other:
  # named:
  #   - project: <data-project>
  #     catalogs: [<catalog>, <catalog>]
  defined:
    - id: <provider>
      catalogUri: https://<provider-domain>/api/catalog
      catalogName: <catalog>
      audience: <provider-audience>
      bucket: <provider-bucket>
      # cloud: <cloud>                   # that of the bucket, the project's unless it says another

# the project's members, at least one, made members of its group in the central identity, and no others (one not listed is
# removed): an email, or {email, firstName, lastName}, the names being set only when the member is first made in the identity
# a project is not valid until it has one, eg
#   - alice@tre.example
#   - {email: bob@tre.example, firstName: Bob, lastName: Hope}
members: []

stacks:
  create:
    auditBucket: ${id}-audit
  # the domains of the TRE are those of the env with the project id as a label after the first, eg azure-jupyter.<project>.<domain>: to name
  # one, ${CLOUD}_JUPYTER_DOMAIN_NAME for example, here, uncomment
  # tre:
  #   domains:
  #     ${CLOUD}_JUPYTER_DOMAIN_NAME: <jupyter-domain>

# how the DNS zones of its domains are delegated from the parent domain: manual (or none, or no value), where you delegate by hand: up does not
# stop, so run it with --until create, add the NS records that dns-delegate shows to the parent zone, then run the rest; or route53, where
# up writes them to the Route 53 hosted zone of the parent domain, in the current AWS account, and runs through
dns:
  delegation: none

# the nodes of its cluster: adjust to the quota of the subscription (AWS has no node pool property, so there the nodes are those of
# the env)
cluster:
  nodePool: ${nodePool}
