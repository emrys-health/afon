# A template: ${cloud} and ${CLOUD} are the project's cloud, in lower and upper case, as the tests give it, so that no cloud is special.
project:
  id: xyz-yyyy-nnnn
  cloud: ${cloud}
  egressIp: 203.0.113.10

identity:
  issuerUrl: https://id.example.org/realms/polaris
  acr: mfa

providers:
  - id: nuh
    catalogUri: https://polaris.nuh.example/api/catalog
    catalogName: xyz-yyyy-nnnn
    audience: provider-nuh
    bucket: nuh-xyz-yyyy-nnnn
  - id: ucl
    catalogUri: https://polaris.ucl.example/api/catalog
    catalogName: xyz-yyyy-nnnn
    audience: provider-ucl
    bucket: ucl-xyz-yyyy-nnnn

stacks:
  create:
    auditBucket: xyz-yyyy-nnnn-audit
    gitBucket: xyz-yyyy-nnnn-gitea
  git:
    domain: git.xyz-yyyy-nnnn.example.org
  tre:
    domains:
      ${CLOUD}_JUPYTER_DOMAIN_NAME: jupyter.xyz-yyyy-nnnn.example.org
    lifetime:
      teardown: "22:00"
