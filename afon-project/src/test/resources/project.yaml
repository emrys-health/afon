# A template: ${cloud} and ${CLOUD} are the project stack's cloud, in lower and upper case, as the tests give it, so that no cloud is special.
projectStack:
  id: xyz-yyyy-nnnn
  cloud: ${cloud}
  egressIp: 203.0.113.10

identity:
  issuerUrl: https://id.example.org/realms/polaris
  acr: mfa

dataProviders:
  defined:
    - id: data1
      catalogUri: https://polaris.data1.example/api/catalog
      catalogName: xyz-yyyy-nnnn
      audience: provider-data1
      bucket: data1-xyz-yyyy-nnnn
    - id: data2
      catalogUri: https://polaris.data2.example/api/catalog
      catalogName: xyz-yyyy-nnnn
      audience: provider-data2
      bucket: data2-xyz-yyyy-nnnn

members: [ada@example.org]

stacks:
  create:
    auditBucket: xyz-yyyy-nnnn-audit
    gitBucket: xyz-yyyy-nnnn-gitea
  git:
    domain: git.xyz-yyyy-nnnn.example.org
  tre:
    domains:
      ${CLOUD}_JUPYTER_DOMAIN_NAME: jupyter.xyz-yyyy-nnnn.example.org
    lifetime:
      teardown: "22:00"
