apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-ip-and-internal-traffic
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: polaris
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: Allow external traffic from the specific IP address
    - from:
        - ipBlock:
            cidr: 35.177.204.48/32

    # Rule 2: Allow all internal cluster traffic from any pod in any namespace
    - from:
        - namespaceSelector: {}
          podSelector: {}