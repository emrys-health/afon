apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: restrict-to-cloud-storage
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      spark-version: 4.0.1
  egress:
    # Rule 1: The pod MUST be allowed to talk to kube-dns to resolve domains
    - toEndpoints:
      - matchLabels:
          io.kubernetes.pod.namespace: default
      - matchLabels:
          io.kubernetes.pod.namespace: kube-system
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*" # Inspect DNS queries to map IPs dynamically
    # Rule 2: The pod is ONLY allowed to send HTTPS traffic to specific cloud domains
    - toFQDNs:
        - matchName: "emrys-afon-buckettrino.s3.eu-west-2.amazonaws.com"
        - matchName: "emrys-afon-bucket.s3.eu-west-2.amazonaws.com"
        - matchName: "emrys-afon-bucket-polaris-forbids.s3.eu-west-2.amazonaws.com"
        - matchName: "emrys_afon_core.storage.googleapis.com"
        - matchName: "westmidsstorageaccount.blob.core.windows.net"
        - matchName: "westmidspolarisazure.click"
        - matchName: "emrysoauth.click"
        - matchName: "emryspolaris.click"
        - matchPattern: "afonstorageaccount.blob.core.windows.net"
