# The stacks the unit tests run against, set by the afon.stacks system property of the surefire config of afon-cdk and
# afon-ops, so that they do not depend on a stacks.yaml in the config dir.  Named otherwise so as not to shadow the
# bundled stacks.yaml on the test classpath.  See it for the format.
#
# They are the bundled stacks but for the full stacks, which have no Trino, so that the tests ensure that the
# composition of a stack can be changed, and that a stack can be added with no change of code, aws-lab, which
# StackDefinitionsTest checks.
stacks:
  # AWS
  # Only the KeyCloak, never holding the egress IP, which the Polaris stacks hold
  aws-keycloak:
    role: identity
    pinnedEgressIp: false
    components: [Keycloak]
  # Polaris uses the KeyCloak server at OIDC_DOMAIN_NAME, which the aws-keycloak stack deploys, so that both can
  # run side by side, while the stacks extending it deploy their own KeyCloak, unless AWS_KEYCLOAK_EXTERNAL is set
  aws-polaris:
    role: catalog
    components: [Polaris]
  # Polaris with JupyterHub and Guacamole behind the oauth2-proxy MFA gate, the Spark operator the notebooks' Spark
  # runs on (which only launches Spark in response to the resources of the Spark component), and monitoring (no Trino, unlike the bundled stacks)
  aws-full:
    role: tre
    components:
      - name: Keycloak
        unless: KEYCLOAK_EXTERNAL
      - Polaris
      - Jupyter
      - NetworkPolicies
      - SparkOperator
      - Spark
      - CrdCleanup
      - Monitoring
      - AwsLogging
      - Git
  # A stack that is not bundled, composed here alone: the notebooks and Spark, but no Trino, Monitoring or Git
  aws-lab:
    components:
      - name: Keycloak
        unless: KEYCLOAK_EXTERNAL
      - Polaris
      - Jupyter
      - NetworkPolicies
      - SparkOperator
      - Spark
      - CrdCleanup

  # Snowflake queries the catalogs of the full stack through its Polaris, so it holds what the full stack holds
  aws-snowflake:
    extends: aws-full
    components: [Snowflake]

  # AZURE
  # As on AWS, only the KeyCloak, which azure-polaris uses, and azure-full if AZURE_KEYCLOAK_EXTERNAL is set
  azure-keycloak:
    role: identity
    pinnedEgressIp: false
    components: [Keycloak]
  azure-polaris:
    role: catalog
    components: [Polaris]
  # AzureLogging, not AwsLogging, which ships the Polaris logs
  azure-full:
    role: tre
    components:
      - name: Keycloak
        unless: KEYCLOAK_EXTERNAL
      - Polaris
      - Jupyter
      - NetworkPolicies
      - SparkOperator
      - Spark
      - CrdCleanup
      - Monitoring
      - AzureLogging
      - Git

  # GCP
  gcp-polaris:
    role: catalog
    components: [Polaris]
